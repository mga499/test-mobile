    const premier = this.expr(etoile);
    if (!this.op(",")) return premier;
    const elts = [premier];
    while (this.op(",")) {
      this.prendre();
      if (this.voir("NL") || this.voir("FIN") || this.op("=") || this.op(")") || this.op(":") || this.op(";")) break;
      elts.push(this.expr(etoile));
    }
    return { k: "tuple", elts, l: premier.l };
  }
  expr(etoile = false) {
    if (etoile && this.op("*")) { const l = this.prendre().l; return { k: "etoile", e: this.ou(), l }; }
    if (this.kw("lambda")) {
      const l = this.prendre().l;
      const params = this.parametres(":");
      this.attendre("OP", ":");
      return { k: "lambda", params, corps: this.expr(), l };
    }
    const e = this.ou();
    if (this.kw("if") ) {
      // ternaire : a if c else b (seulement si un else suit)
      const sauvegarde = this.p;
      this.prendre();
      const c = this.ou();
      if (this.kw("else")) { this.prendre(); return { k: "si", c, a: e, b: this.expr(), l: e.l }; }
      this.p = sauvegarde;
    }
    return e;
  }
  ou() { let a = this.et(); while (this.kw("or")) { const l = this.prendre().l; a = { k: "ou", a, b: this.et(), l }; } return a; }
  et() { let a = this.non(); while (this.kw("and")) { const l = this.prendre().l; a = { k: "et", a, b: this.non(), l }; } return a; }
  non() { if (this.kw("not")) { const l = this.prendre().l; return { k: "non", e: this.non(), l }; } return this.comparaison(); }
  comparaison() {
    const premier = this.bits();
    const ops = [], vals = [premier];
    while (true) {
      let op = null;
      if (["<", ">", "==", "!=", "<=", ">="].some((o) => this.op(o))) op = this.prendre().v;
      else if (this.kw("in")) { this.prendre(); op = "in"; }
      else if (this.kw("not") && this.j[this.p + 1].t === "KW" && this.j[this.p + 1].v === "in") { this.p += 2; op = "not in"; }
      else if (this.kw("is")) { this.prendre(); if (this.kw("not")) { this.prendre(); op = "is not"; } else op = "is"; }
      else break;
      ops.push(op); vals.push(this.bits());
    }
    return ops.length ? { k: "cmp", ops, vals, l: premier.l } : premier;
  }
  bits() {
    let a = this.decalage();
    while (this.op("|") || this.op("&") || this.op("^")) { const t = this.prendre(); a = { k: "bin", op: t.v, a, b: this.decalage(), l: t.l }; }
    return a;
  }
  decalage() { let a = this.somme(); while (this.op("<<") || this.op(">>")) { const t = this.prendre(); a = { k: "bin", op: t.v, a, b: this.somme(), l: t.l }; } return a; }
  somme() { let a = this.terme(); while (this.op("+") || this.op("-")) { const t = this.prendre(); a = { k: "bin", op: t.v, a, b: this.terme(), l: t.l }; } return a; }
  terme() {
    let a = this.unaire();
    while (["*", "/", "//", "%", "@"].some((o) => this.op(o))) { const t = this.prendre(); a = { k: "bin", op: t.v, a, b: this.unaire(), l: t.l }; }
    return a;
  }
  unaire() {
    if (this.op("-") || this.op("+") || this.op("~")) { const t = this.prendre(); return { k: "un", op: t.v, e: this.unaire(), l: t.l }; }
    return this.puissance();
  }
  puissance() {
    const a = this.primaire();
    if (this.op("**")) { const t = this.prendre(); return { k: "bin", op: "**", a, b: this.unaire(), l: t.l }; }
    return a;
  }
  primaire() {
    let e = this.atome();
    while (true) {
      if (this.op("(")) {
        const l = this.prendre().l;
        const args = [], kwargs = [];
        while (!this.op(")")) {
          if (this.op("*")) { this.prendre(); args.push({ k: "etoile", e: this.expr() }); }
          else if (this.op("**")) { this.prendre(); kwargs.push([null, this.expr()]); }
          else if (this.voir("NOM") && this.j[this.p + 1].t === "OP" && this.j[this.p + 1].v === "=") { const n = this.prendre().v; this.prendre(); kwargs.push([n, this.expr()]); }
          else {
            const a = this.expr();
            if (this.kw("for")) args.push(this.comprehension("gen", a, null));
            else args.push(a);
          }
          if (!this.op(")")) this.attendre("OP", ",", "virgule_arguments");
        }
        this.prendre();
        e = { k: "appel", f: e, args, kwargs, l };
      } else if (this.op("[")) {
        const l = this.prendre().l;
        const index = this.indices();
        this.attendre("OP", "]", "crochet");
        e = { k: "index", e, index, l };
      } else if (this.op(".")) {
        const l = this.prendre().l;
        e = { k: "attr", e, nom: this.attendre("NOM", undefined, "attribut").v, l };
      } else break;
    }
    return e;
  }
  indices() {
    const tranche = () => {
      const l = this.cour.l;
      let debut = null, fin = null, pas = null;
      if (!this.op(":")) { debut = this.expr(); if (!this.op(":")) return debut; }
      this.prendre();
      if (!this.op("]") && !this.op(":") && !this.op(",")) fin = this.expr();
      if (this.op(":")) { this.prendre(); if (!this.op("]") && !this.op(",")) pas = this.expr(); }
      return { k: "tranche", debut, fin, pas, l };
    };
    const premier = tranche();
    if (!this.op(",")) return premier;
    const elts = [premier];
    while (this.op(",")) { this.prendre(); if (this.op("]")) break; elts.push(tranche()); }
    return { k: "tuple", elts, l: premier.l };
  }
  comprehension(genre, elt, valeur) {
    const boucles = [];
    while (this.kw("for")) {
      this.prendre();
      const cible = this.cibles();
      this.attendre("KW", "in");
      const it = this.ou();
      const conditions = [];
      while (this.kw("if")) { this.prendre(); conditions.push(this.ouSansTernaire()); }
      boucles.push({ cible, it, conditions });
    }
    return { k: "comp", genre, elt, valeur, boucles, l: elt.l };
  }
  ouSansTernaire() { return this.ou(); }
  atome() {
    const x = this.cour, l = x.l;
    if (x.t === "NUM") { this.prendre(); return { k: "const", v: x.v, l }; }
    if (x.t === "STR" || x.t === "FSTR") {
      const parts = [];
      while (this.voir("STR") || this.voir("FSTR")) { const s = this.prendre(); parts.push(s.t === "FSTR" ? this.fchaine(s.v, s.l) : { k: "const", v: s.v, l }); }
      return parts.length === 1 ? parts[0] : { k: "concat", parts, l };
    }
    if (x.t === "NOM") { this.prendre(); return { k: "nom", nom: x.v, l }; }
    if (x.t === "KW") {
      if (x.v === "True" || x.v === "False") { this.prendre(); return { k: "const", v: x.v === "True", l }; }
      if (x.v === "None") { this.prendre(); return { k: "const", v: null, l }; }
      throw new ErreurPy("SyntaxError", `mot_cle:${x.v}`, l);
    }
    if (x.t === "OP") {
      if (x.v === "(") {
        this.prendre();
        if (this.op(")")) { this.prendre(); return { k: "tuple", elts: [], l }; }
        const premier = this.expr(true);
        if (this.kw("for")) { const c = this.comprehension("gen", premier, null); this.attendre("OP", ")"); return c; }
        if (this.op(")")) { this.prendre(); return premier; }
        const elts = [premier];
        while (this.op(",")) { this.prendre(); if (this.op(")")) break; elts.push(this.expr(true)); }
        this.attendre("OP", ")", "parenthese");
        return { k: "tuple", elts, l };
      }
      if (x.v === "[") {
        this.prendre();
        const elts = [];
        if (!this.op("]")) {
          const premier = this.expr(true);
          if (this.kw("for")) { const c = this.comprehension("liste", premier, null); this.attendre("OP", "]"); return c; }
          elts.push(premier);
          while (this.op(",")) { this.prendre(); if (this.op("]")) break; elts.push(this.expr(true)); }
        }
        this.attendre("OP", "]", "crochet");
        return { k: "liste", elts, l };
      }
      if (x.v === "{") {
        this.prendre();
        if (this.op("}")) { this.prendre(); return { k: "dict", paires: [], l }; }
        const cle = this.expr();
        if (this.op(":")) {
          this.prendre();
          const val = this.expr();
          if (this.kw("for")) { const c = this.comprehension("dict", cle, val); this.attendre("OP", "}"); return c; }
          const paires = [[cle, val]];
          while (this.op(",")) { this.prendre(); if (this.op("}")) break; const k = this.expr(); this.attendre("OP", ":", "deux_points_dict"); paires.push([k, this.expr()]); }
          this.attendre("OP", "}", "accolade");
          return { k: "dict", paires, l };
        }
        if (this.kw("for")) { const c = this.comprehension("set", cle, null); this.attendre("OP", "}"); return c; }
        const elts = [cle];
        while (this.op(",")) { this.prendre(); if (this.op("}")) break; elts.push(this.expr()); }
        this.attendre("OP", "}", "accolade");
        return { k: "set", elts, l };
      }
    }
    if (x.t === "NL" || x.t === "FIN") throw new ErreurPy("SyntaxError", "ligne_incomplete", l);
    throw new ErreurPy("SyntaxError", `inattendu:${x.v || x.t}`, l);
  }
  fchaine(texte, l) {
    const parts = [];
    let i = 0, morceau = "";
    while (i < texte.length) {
      const c = texte[i];
      if (c === "{" && texte[i + 1] === "{") { morceau += "{"; i += 2; continue; }
      if (c === "}" && texte[i + 1] === "}") { morceau += "}"; i += 2; continue; }
      if (c === "{") {
        if (morceau) { parts.push({ k: "const", v: morceau, l }); morceau = ""; }
        let prof = 0, j = i + 1, dedans = "";
        while (j < texte.length) {
          const d = texte[j];
          if ("([{".includes(d)) prof++;
          if (")]}".includes(d)) { if (prof === 0 && d === "}") break; prof--; }
          dedans += d; j++;
        }
        if (j >= texte.length) throw new ErreurPy("SyntaxError", "fstring_accolade", l);
        let format = "", conv = null;
        let prof2 = 0, coupe = -1;
        for (let q = 0; q < dedans.length; q++) {
          const d = dedans[q];
          if ("([{'\"".includes(d)) prof2++;
          if (")]}".includes(d)) prof2--;
          if (d === ":" && prof2 === 0 && dedans[q + 1] !== "=") { coupe = q; break; }
        }
        if (coupe >= 0) { format = dedans.slice(coupe + 1); dedans = dedans.slice(0, coupe); }
        const mc = /!([rsa])$/.exec(dedans); if (mc) { conv = mc[1]; dedans = dedans.slice(0, -2); }
        let egal = false;
        if (/=\s*$/.test(dedans) && !/[=!<>]=\s*$/.test(dedans)) { egal = true; dedans = dedans.replace(/=\s*$/, ""); }
        if (!dedans.trim()) throw new ErreurPy("SyntaxError", "fstring_vide", l);
        const sous = new Analyseur(decouper(dedans.trim()).map((jt) => ({ ...jt, l })));
        const e = sous.expr();
        if (egal) parts.push({ k: "const", v: dedans + "=", l });
        parts.push({ k: "fval", e, format, conv: egal && !conv && !format ? "r" : conv, l });
        i = j + 1; continue;
      }
      morceau += c; i++;
    }
    if (morceau) parts.push({ k: "const", v: morceau, l });
    return { k: "concat", parts, l };
  }
}

/* -------------------------------------------------------------------------------- 3) les valeurs Python */
class Flottant { constructor(v) { this.v = v; } }
class Tuple { constructor(items) { this.items = items; } }
class Dict { constructor() { this.m = new Map(); } }
class Ensemble { constructor() { this.m = new Map(); } }
class Fonction { constructor(nom, params, corps, portee, estLambda) { Object.assign(this, { nom, params, corps, portee, estLambda }); } }
class Natif { constructor(nom, f) { this.nom = nom; this.f = f; } }
class Classe { constructor(nom, base, attrs) { Object.assign(this, { nom, base, attrs }); } }
class Objet { constructor(classe) { this.classe = classe; this.attrs = new Map(); } }
class Methode { constructor(soi, f) { this.soi = soi; this.f = f; } }
class Module { constructor(nom, attrs) { this.nom = nom; this.attrs = attrs; } }
class Portee { constructor(parent, globales) { this.v = new Map(); this.parent = parent; this.globales = globales || this; this.noms_globaux = new Set(); } }
class Arret extends Error { constructor(genre, valeur) { super(genre); this.genre = genre; this.valeur = valeur; } }
class ExceptionPy { constructor(type, message) { this.type = type; this.message = message; } }

const num = (x) => x instanceof Flottant ? x.v : x === true ? 1 : x === false ? 0 : x;
const estNombre = (x) => typeof x === "number" || x instanceof Flottant || typeof x === "boolean";
const flot = (v) => new Flottant(v);
function typeNom(x) {
  if (x === null) return "NoneType";
  if (typeof x === "boolean") return "bool";
  if (typeof x === "number") return "int";
  if (x instanceof Flottant) return "float";
  if (typeof x === "string") return "str";
  if (Array.isArray(x)) return "list";
  if (x instanceof Tuple) return "tuple";
  if (x instanceof Dict) return "dict";
  if (x instanceof Ensemble) return "set";
  if (x instanceof Fonction || x instanceof Natif || x instanceof Methode) return "function";
  if (x instanceof Classe) return "type";
  if (x instanceof Objet) return x.classe.nom;
  if (x instanceof Module) return "module";
  if (x instanceof ExceptionPy) return x.type;
  return "object";
}
function cleDe(x) {
  if (typeof x === "boolean") return "n:" + (x ? 1 : 0);
  if (typeof x === "number") return "n:" + x;
  if (x instanceof Flottant) return "n:" + x.v;
  if (typeof x === "string") return "s:" + x;
  if (x === null) return "None";
  if (x instanceof Tuple) return "t:" + x.items.map(cleDe).join("|");
  if (x instanceof Objet || x instanceof Classe || x instanceof Fonction) { if (!x._id) x._id = Math.random(); return "o:" + x._id; }
  throw new ExceptionPy("TypeError", `unhashable type: '${typeNom(x)}'`);
}
function floatRepr(v) {
  if (Number.isNaN(v)) return "nan";
  if (!Number.isFinite(v)) return v > 0 ? "inf" : "-inf";
  if (Number.isInteger(v) && Math.abs(v) < 1e16) return v.toFixed(1);
  let s = String(v);
  if (s.includes("e")) s = s.replace(/e\+?(-?)(\d)$/, "e$10$2").replace("e+", "e+");
  return s;
}
function repr(x, vus = new Set()) {
  if (x === null) return "None";
  if (x === true) return "True";
  if (x === false) return "False";
  if (typeof x === "number") return String(x);
  if (x instanceof Flottant) return floatRepr(x.v);
  if (typeof x === "string") {
    const q = x.includes("'") && !x.includes('"') ? '"' : "'";
    return q + x.replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/\t/g, "\\t").replace(q === "'" ? /'/g : /"/g, "\\" + q) + q;
  }
  if (vus.has(x)) return "[...]";
  if (Array.isArray(x)) { vus.add(x); const r = "[" + x.map((e) => repr(e, vus)).join(", ") + "]"; vus.delete(x); return r; }
  if (x instanceof Tuple) return "(" + x.items.map((e) => repr(e, vus)).join(", ") + (x.items.length === 1 ? ",)" : ")");
  if (x instanceof Dict) { vus.add(x); const r = "{" + [...x.m.values()].map(([k, v]) => repr(k, vus) + ": " + repr(v, vus)).join(", ") + "}"; vus.delete(x); return r; }
  if (x instanceof Ensemble) return x.m.size ? "{" + [...x.m.values()].map((e) => repr(e, vus)).join(", ") + "}" : "set()";
  if (x instanceof Fonction) return `<function ${x.nom}>`;
  if (x instanceof Natif) return `<built-in function ${x.nom}>`;
  if (x instanceof Methode) return `<bound method ${x.f.nom}>`;
  if (x instanceof Classe) return `<class '${x.nom}'>`;
  if (x instanceof Module) return `<module '${x.nom}'>`;
  if (x instanceof ExceptionPy) return `${x.type}(${repr(x.message)})`;
  if (x instanceof Objet) return `<${x.classe.nom} object>`;
  return String(x);
}

/* -------------------------------------------------------------------------------- 4) l'interpréteur */
class Interpreteur {
  constructor({ entrees = [], limite = 3000000 } = {}) {
    this.sortie = []; this.entrees = entrees.slice(); this.pas = 0; this.limite = limite; this.fichiers = {};
    this.globales = new Portee(null);
    this.globales.globales = this.globales;
    this.installerNatifs();
  }
  prendreKw() { const k = this._kw || {}; this._kw = {}; return k; }
  ecrire(t) { this.sortie.push(t); if (this.sortie.length > 4000) throw new ExceptionPy("RuntimeError", "trop_de_sortie"); }
  tick(l) { if (++this.pas > this.limite) throw new ExceptionPy("TimeoutError", "temps_depasse"); this.ligne = l; }
  erreur(type, message) { return new ExceptionPy(type, message); }

  executer(source) {
    const arbre = new Analyseur(decouper(source)).programme();
    this.bloc(arbre, this.globales);
  }

  /* ---- instructions */
  bloc(corps, p) { for (const s of corps) this.instr(s, p); }
  instr(s, p) {
    this.tick(s.l);
    switch (s.k) {
      case "expr": this.eval(s.e, p); return;
      case "assign": { const v = this.eval(s.e, p); for (const c of s.cibles) this.affecter(c, v, p); return; }
      case "aug": {
        const ancien = this.eval(s.cible, p), d = this.eval(s.e, p);
        let v;
        if (s.op === "+" && Array.isArray(ancien)) { ancien.push(...this.iterer(d)); v = ancien; }
        else v = this.binaire(s.op, ancien, d);
        this.affecter(s.cible, v, p); return;
      }
      case "pass": return;
      case "if": { for (const [c, corps] of s.branches) if (this.vrai(this.eval(c, p))) return this.bloc(corps, p); if (s.sinon) this.bloc(s.sinon, p); return; }
      case "while": {
        let casse = false;
        while (this.vrai(this.eval(s.c, p))) {
          this.tick(s.l);
          try { this.bloc(s.corps, p); } catch (e) { if (e instanceof Arret && e.genre === "break") { casse = true; break; } if (e instanceof Arret && e.genre === "continue") continue; throw e; }
        }
        if (!casse && s.sinon) this.bloc(s.sinon, p);
        return;
      }
      case "for": {
        let casse = false;
        for (const v of this.iterer(this.eval(s.it, p))) {
          this.tick(s.l);
          this.affecter(s.cible, v, p);
          try { this.bloc(s.corps, p); } catch (e) { if (e instanceof Arret && e.genre === "break") { casse = true; break; } if (e instanceof Arret && e.genre === "continue") continue; throw e; }
        }
        if (!casse && s.sinon) this.bloc(s.sinon, p);
        return;
      }
      case "break": throw new Arret("break");
      case "continue": throw new Arret("continue");
      case "return": throw new Arret("return", s.e ? this.eval(s.e, p) : null);
      case "def": { const f = new Fonction(s.nom, this.evalParams(s.params, p), s.corps, p); this.definir(p, s.nom, f); return; }
      case "class": {
        const base = s.base ? this.eval(s.base, p) : null;
        if (base && !(base instanceof Classe)) throw this.erreur("TypeError", "base de classe invalide");
        const portee = new Portee(p, p.globales);
        const classe = new Classe(s.nom, base, portee.v);
        portee.classe = classe;
        this.bloc(s.corps, portee);
        for (const v of portee.v.values()) if (v instanceof Fonction) v.classe = classe;
        this.definir(p, s.nom, classe); return;
      }
      case "try": {
        try { this.bloc(s.corps, p); }
        catch (e) {
          if (e instanceof Arret || !(e instanceof ExceptionPy)) { if (s.enfin) this.bloc(s.enfin, p); throw e; }
          const g = s.gestionnaires.find((h) => !h.types || this.attrape(e, this.eval(h.types, p)));
          if (!g) { if (s.enfin) this.bloc(s.enfin, p); throw e; }
          if (g.nom) this.definir(p, g.nom, e);
          try { this.bloc(g.corps, p); } finally { if (s.enfin) this.bloc(s.enfin, p); }
          return;
        }
        if (s.sinon) this.bloc(s.sinon, p);
        if (s.enfin) this.bloc(s.enfin, p);
        return;
      }
      case "with": {
        const v = this.eval(s.e, p);
        if (s.nom) this.affecter(s.nom, v, p);
        try { this.bloc(s.corps, p); } finally { if (v instanceof Objet && v.fermer) v.fermer(); }
        return;
      }
      case "global": for (const n of s.noms) p.noms_globaux.add(n); return;
      case "del": {
        const cibles = s.cibles.k === "tuple" ? s.cibles.elts : [s.cibles];
        for (const c of cibles) {
          if (c.k === "nom") { if (!p.v.delete(c.nom)) throw this.erreur("NameError", `name '${c.nom}' is not defined`); }
          else if (c.k === "index") {
            const o = this.eval(c.e, p), i = this.eval(c.index, p);
            if (Array.isArray(o)) { const n = this.indiceListe(o, i); o.splice(n, 1); }
            else if (o instanceof Dict) { if (!o.m.delete(cleDe(i))) throw this.erreur("KeyError", repr(i)); }
          }
        }
        return;
      }
      case "assert": if (!this.vrai(this.eval(s.c, p))) throw this.erreur("AssertionError", s.m ? this.str(this.eval(s.m, p)) : ""); return;
      case "raise": {
        if (!s.e) throw this.erreur("RuntimeError", "raise sans exception");
        let v = this.eval(s.e, p);
        if (v instanceof Natif && v.exception) v = new ExceptionPy(v.nom, "");
        if (v instanceof Classe) v = this.appeler(v, [], {});
        if (v instanceof Objet) { const ex = new ExceptionPy(v.classe.nom, this.str(v.attrs.get("message") ?? (v.args ? v.args[0] : "") ?? "")); ex.objet = v; throw ex; }
        if (!(v instanceof ExceptionPy)) throw this.erreur("TypeError", "on ne peut lever que des exceptions");

      fstring_accolade: "une accolade `{` n'est pas refermée dans ta f-string.", fstring_vide: "il y a des accolades `{}` vides dans ta f-string.",
      virgule_arguments: "il manque une **virgule** entre deux valeurs, ou une parenthèse.", virgule_parametres: "il manque une **virgule** entre les paramètres.",
      parenthese: "une **parenthèse** n'est pas refermée correctement.", crochet: "un **crochet `]`** est mal placé ou manquant.", accolade: "une **accolade `}`** est mal placée ou manquante.",

  return { ligne: n, explication, contexte, type, message: m };
}

/** Lance du code Python. Renvoie {sortie, erreur:{ligne, explication, contexte, type} | null, entreesManquantes}. */
function executerPython(code, entrees = [], options = {}) {
  const I = new Interpreteur({ entrees });
  if (options.echo === false) I.echo = false;
  try { I.executer(code); return { sortie: I.sortie.join(""), erreur: null, interpreteur: I }; }
  catch (e) {
    if (e instanceof Arret && e.genre === "exit") return { sortie: I.sortie.join(""), erreur: null, interpreteur: I };
    let err;
    if (e instanceof ErreurPy) err = e;
    else if (e instanceof ExceptionPy) err = { type: e.type, message: typeof e.message === "string" ? e.message : I.str(e.message), ligne: I.ligne };
    else if (e instanceof Arret) err = { type: "SyntaxError", message: e.genre === "return" ? "return hors d'une fonction" : `'${e.genre}' hors d'une boucle`, ligne: I.ligne };
    else if (e instanceof RangeError) err = { type: "RecursionError", message: "trop profond", ligne: I.ligne };
    else err = { type: "Erreur", message: String(e && e.message || e), ligne: I.ligne };
    return { sortie: I.sortie.join(""), erreur: expliquerErreurPy(err, code), interpreteur: I };
  }
}

const LIGNE_CODE = /^\s*(def |class |if |elif |else\s*:|for |while |import |from \w+ import|return\b|print\s*\(|try\s*:|except|with |#|[A-Za-z_][\w.[\]]*\s*(=|\+=|-=|\*=)[^=]|[A-Za-z_][\w.]*\(.*\)\s*$|\)|\]|\}|pass\b|break\b|continue\b)/;

  if (blocs.length) return blocs.join("\n\n");

  if (lignes.length > 1 && !LIGNE_CODE.test(lignes[0])) lignes = lignes.slice(1);
  const pleines = lignes.filter((l) => l.trim());

  if (pleines.length >= 2 && codees >= Math.max(2, 0.6 * pleines.length)) return lignes.join("\n").replace(/^\n+|\n+$/g, "");

function detecterLangage(texte) {
  const debut = texte.trimStart().slice(0, 200).toLowerCase();

  if (/\b(let|const|var|function)\s+\w|console\.log|=>|document\./.test(texte) && !/^\s*def |^\s*import |:\s*$/m.test(texte)) return "js";
  if (/^\s*(def |class |import |from |print\(|for .+ in |if .+:|while .+:)|=/m.test(texte)) return "python";

function contexteLignes(code, n) {

const CACHE_NET = new Map();
async function telechargerJson(url) {
  if (CACHE_NET.has(url) && Date.now() - CACHE_NET.get(url)[0] < 6e5) return CACHE_NET.get(url)[1];
  const ctrl = new AbortController();
  const minuteur = setTimeout(() => ctrl.abort(), 7000);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error("http " + r.status);
    const d = await r.json();
    CACHE_NET.set(url, [Date.now(), d]);
    return d;
  } catch (e) { const err = new Error("hors_ligne"); err.horsLigne = true; throw err; }
  finally { clearTimeout(minuteur); }
}

function versCanvas(img) {
  const c = document.createElement("canvas"); c.width = img.l; c.height = img.h;
  const ctx = c.getContext("2d"), d = ctx.createImageData(img.l, img.h);
  for (let i = 0, j = 0; i < img.px.length; i += 3, j += 4) { d.data[j] = img.px[i]; d.data[j + 1] = img.px[i + 1]; d.data[j + 2] = img.px[i + 2]; d.data[j + 3] = 255; }
  ctx.putImageData(d, 0, 0);
  return c;
}
function depuisCanvas(c) {
  const d = c.getContext("2d").getImageData(0, 0, c.width, c.height).data, img = nouvelleImage(c.width, c.height);
  for (let i = 0, j = 0; j < d.length; i += 3, j += 4) { const a = d[j + 3] / 255; img.px[i] = d[j] * a + 255 * (1 - a); img.px[i + 1] = d[j + 1] * a + 255 * (1 - a); img.px[i + 2] = d[j + 2] * a + 255 * (1 - a); }
  return img;
}

async function garderImageWeb(img) {

async function chargerImageWeb(id) {

  if (!im) return null;

/** Une photo choisie avec le 📎 : réduite à 1280 px maximum (le navigateur la décode, la retouche est faite main). */
function lirePhoto(fichier) {
  return new Promise((ok, ko) => {
    const u = URL.createObjectURL(fichier), im = new window.Image();
    im.onload = () => {
      const f = Math.min(1, 1280 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(im.naturalWidth * f)); c.height = Math.max(1, Math.round(im.naturalHeight * f));
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); ok(depuisCanvas(c));
    };
    im.onerror = () => { URL.revokeObjectURL(u); ko(new Error("format d'image non reconnu")); };
    im.src = u;
  });

const MOTS_CLES_JS = new Set(["let", "const", "var", "function", "return", "if", "else", "for", "while", "do", "switch", "case", "break", "continue", "new", "class", "this", "true", "false", "null", "undefined", "of", "in", "async", "await", "try", "catch", "typeof", "import", "export", "from", "default"]);
const FONCTIONS_JS = new Set(["console", "log", "alert", "document", "getElementById", "querySelector", "Math", "parseInt", "parseFloat", "setTimeout", "setInterval", "addEventListener", "window", "JSON", "Array", "String"]);

function colorerCode(code) {
  const lang = detecterLangage(code);
  if (lang === "texte") return echapper(code);
  const span = (cls, t) => `<span class="s-${cls}">${echapper(t)}</span>`;
  if (lang === "html") {
    return code.replace(/(<!--[\s\S]*?-->)|(<\/?[A-Za-z!][\w-]*|\/?>)|([\w-]+(?==))|("[^"]*"|'[^']*')|([^<"'\w]+|\w+|.)/g, (m, com, tag, attr, str) =>
      com ? span("com", com) : tag ? span("balise", tag) : attr ? span("attr", attr) : str ? span("str", str) : echapper(m));
  }
  const motif = lang === "python"
    ? /("""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$))|(#[^\n]*)|([rRbBfFuU]{0,2}(?:"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?))|(\b\d+(?:\.\d+)?\b)|([A-Za-z_À-ɏ][\wÀ-ɏ]*)|(\s+|.)/g
    : /(\/\*[\s\S]*?(?:\*\/|$))|(\/\/[^\n]*)|(`(?:\\.|[^`\\])*`?|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)|(\s+|.)/g;
  const cles = lang === "python" ? MOTS_CLES_PY : MOTS_CLES_JS, fonctions = lang === "python" ? FONCTIONS_PY : FONCTIONS_JS;
  let precedent = "", sortie = "";
  for (const m of code.matchAll(motif)) {
    const [tout, triple, com, str, nb, mot] = m;
    if (triple) sortie += span(lang === "python" ? "str" : "com", triple);
    else if (com) sortie += span("com", com);
    else if (str) sortie += span("str", str);
    else if (nb) sortie += span("nb", nb);
    else if (mot) {
      if (["def", "class", "function"].includes(precedent)) sortie += span("nom", mot);
      else if (cles.has(mot)) sortie += span("cle", mot);
      else if (fonctions.has(mot)) sortie += span("fn", mot);
      else sortie += echapper(mot);
      precedent = mot; continue;
    } else sortie += echapper(tout);
    if (tout.trim()) precedent = "";
  }
  return sortie;
}
const MOTIF_INLINE = /(\[[^\]\n]+\]\(https?:\/\/[^)\s]+\))|(\*\*[^*\n]+?\*\*)|(`[^`\n]+`)|((?<![\w*])\*[^*\s][^*\n]*?\*(?![\w*]))|((?<!\w)_[^_\s][^_\n]*?_(?!\w))/g;
function inlineHTML(ligne) {
  let sortie = "", pos = 0;
  for (const m of ligne.matchAll(MOTIF_INLINE)) {
    sortie += echapper(ligne.slice(pos, m.index));
    const j = m[0];
    if (m[1]) { const l = /^\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)$/.exec(j); sortie += `<a href="${echapper(l[2])}" target="_blank" rel="noopener">${echapper(l[1])}</a>`; }
    else if (m[2]) sortie += `<strong>${inlineHTML(j.slice(2, -2))}</strong>`;
    else if (m[3]) sortie += `<code>${echapper(j.slice(1, -1))}</code>`;
    else sortie += `<em>${inlineHTML(j.slice(1, -1))}</em>`;
    pos = m.index + j.length;
  }
  return sortie + echapper(ligne.slice(pos));
}
/** Markdown -> HTML. Les blocs de code reçoivent leurs boutons (copier, ▶ lancer). */
function versHTML(texte, { boutonsCode = true } = {}) {
  const lignes = texte.split("\n"), html = [];
  let liste = null;
  const fermerListe = () => { if (liste) { html.push(liste === "ul" ? "</ul>" : "</ol>"); liste = null; } };
  for (let i = 0; i < lignes.length; i++) {
    const l = lignes[i], b = l.trim();
    if (b.startsWith("```")) {
      fermerListe();
      const code = [];
      i++;
      while (i < lignes.length && !lignes[i].trim().startsWith("```")) code.push(lignes[i++]);
      const brut = code.join("\n");
      const py = boutonsCode && detecterLangage(brut) === "python" && !analyserSyntaxe(brut) && !/import tkinter|from tkinter/.test(brut);
      // numéros de ligne pour le Python d'au moins 3 lignes (pratique pour « change la ligne 5 »)
      const numeros = code.length >= 3 && detecterLangage(brut) === "python" ? `<div class="num" aria-hidden="true">${code.map((_, k) => k + 1).join("\n")}</div>` : "";
      html.push(`<div class="code${numeros ? " numerote" : ""}"><div class="code-int">${numeros}<pre>${colorerCode(brut)}</pre></div>${boutonsCode ? `<div class="code-actions"><button type="button" data-copier>Copier</button>${py ? '<button type="button" data-pas>🐾 Pas à pas</button><button type="button" data-lancer>▶ Lancer</button>' : ""}</div>` : ""}<textarea hidden>${echapper(brut)}</textarea></div>`);
      continue;
    }
    if (!b) { fermerListe(); html.push('<div class="vide"></div>'); continue; }
    let m;
    if ((m = /^!\[(.*?)\]\(img:([\w]+)\)$/.exec(b))) { fermerListe(); html.push(`<figure class="image-bulle"><img data-img="${m[2]}" alt="${echapper(m[1] || "image")}"></figure>`); }
    else if ((m = /^#{1,3}\s+(.*)$/.exec(b))) { fermerListe(); html.push(`<p class="titre">${inlineHTML(m[1])}</p>`); }
    else if ((m = /^[-*•]\s+(.*)$/.exec(b))) { if (liste !== "ul") { fermerListe(); html.push("<ul>"); liste = "ul"; } html.push(`<li>${inlineHTML(m[1])}</li>`); }
    else if ((m = /^(\d{1,3})[.)]\s+(.*)$/.exec(b))) { if (liste !== "ol") { fermerListe(); html.push(`<ol start="${m[1]}">`); liste = "ol"; } html.push(`<li>${inlineHTML(m[2])}</li>`); }
    else if (/^ {2,}\S/.test(l) && liste) { html.push(`<li class="suite">${inlineHTML(b)}</li>`); }
    else { fermerListe(); html.push(`<p>${inlineHTML(l.trimEnd())}</p>`); }
  }
  fermerListe();
  while (html.length && html[html.length - 1] === '<div class="vide"></div>') html.pop();
  return html.join("");
}
/** Ferme les ** et ``` ouverts pendant l'animation d'écriture. */
function fermerMarkdown(t) {
  if ((t.match(/```/g) || []).length % 2) t += "\n```";
  const sansCode = t.replace(/```[\s\S]*?```/g, "");
  if ((sansCode.match(/\*\*/g) || []).length % 2) t += "**";
  return t;
}

  const r = await ecouter();
  b.classList.remove("ecoute"); changerExpression("content", 0);
  if (r.erreur) { if (r.erreur !== "annule") toast("🎤 " + ERREURS_MICRO[r.erreur], 3500); return; }
  const [texte, sur] = bot.choisirTranscription(r.candidats);
  if (!texte) return;
  const propre = texte[0].toUpperCase() + texte.slice(1);
  if (sur) envoyer(propre);
  else { $("#texte").value = propre; ajusterSaisie(); $("#texte").focus(); toast("🎤 Pas sûr d'avoir bien entendu : vérifie, puis envoie", 3800); }
}

/* ---------------------------------------------------------------- le mode APPEL */
const FIN_APPEL = ["au revoir", "raccroche", "fin de l appel", "termine l appel", "on raccroche", "bye", "salut a plus", "a plus tard", "bonne nuit", "c est tout", "stop l appel", "arrete l appel", "a plus", "tchao", "ciao"];
const appel = {
  actif: false, etat: "accueil", generation: 0, sousTitres: true, muet: false,
  demarrer() {
    if (this.actif || ui.occupe) return;
    if (!ReconnaissanceVocale) { ajouterMessageBot("📞 " + ERREURS_MICRO.indisponible + " *(La voix de mes réponses marche quand même : active-la dans ⚙️ Réglages → Voix.)*"); return; }
    if (ui.accueil) { $("#messages").innerHTML = ""; ui.accueil = false; }
    Object.assign(this, { actif: true, debut: Date.now(), silences: 0, douteux: 0, phase: 0, bouche: 0, cible: 0, prochain: 0, annonces: [], fermerApres: false, pauseApres: false, texteToi: "", texteLui: "" });
    $("#appel").hidden = false;
    try { navigator.wakeLock && navigator.wakeLock.request("screen").then((l) => (this.verrou = l)).catch(() => {}); } catch (e) { /* rien */ }
    const p = bot.prenom;
    this.dire(hasard([p ? `Salut ${p} ! Je t'écoute.` : "Salut ! Je t'écoute.", p ? `Allô ${p} ? Vas-y, je t'écoute !` : "Allô ? Vas-y, je t'écoute !", "Coucou ! De quoi tu veux parler ?"]));
    this.boucle();
  },
  dire(texte, apres) {
    this.etat = "parle"; this.texteLui = texte; this.majTextes();
    const oral = versionOrale(texte);
    const g = ++this.generation;
    const fin = () => { if (g === this.generation && this.actif) this.apresParole(); };
    if (!window.speechSynthesis) { setTimeout(fin, Math.max(1500, oral.length * 65)); return; }
    parler(oral, { oral: true, fin });
  },
  apresParole() {
    if (this.fermerApres) return this.raccrocher();
    if (this.annonces.length) return this.dire(this.annonces.shift());
    if (this.pauseApres || this.muet) { this.pauseApres = false; this.etat = "pause"; this.majTextes(); return; }
    this.ecouter();
  },
  async ecouter() {
    if (!this.actif) return;
    this.etat = "ecoute"; this.majTextes();
    const g = ++this.generation;
    const r = await ecouter();
    if (g !== this.generation || !this.actif || this.etat !== "ecoute") return;
    this.traiter(r);
  },
  async traiter(r) {
    if (r.erreur) {
      if (r.erreur === "delai") { this.silences++; if (this.silences >= 2) { this.pauseApres = true; this.dire("Je reste là. Touche mon visage quand tu veux me parler."); } else this.ecouter(); return; }
      if (r.erreur === "annule") return;
      this.pauseApres = true; this.dire(ERREURS_MICRO[r.erreur]); return;
    }
    let [texte, sur] = bot.choisirTranscription(r.candidats);
    if (texte && !sur && this.douteux < 1) { this.douteux++; this.texteToi = texte + " ?"; this.dire(hasard(["Pardon, je n'ai pas bien entendu. Tu peux répéter ?", "Hein ? Redis-moi ça ?", "Désolé, tu peux répéter plus lentement ?"])); return; }
    this.douteux = 0;
    if (!texte) return this.ecouter();
    const correction = bot.correctionOrale(texte);
    if (correction !== null) {
      bot.retirerDernierEchange();
      if (!correction) { this.texteToi = texte; this.dire(hasard(["Oups, désolé ! Redis-moi ?", "Pardon, j'ai mal compris. Tu peux répéter ?"])); return; }
      texte = correction;
    }
    this.silences = 0;
    this.texteToi = texte[0].toUpperCase() + texte.slice(1);
    const t = norm(texte);
    if (FIN_APPEL.includes(t) || ["au revoir", "raccroche", "fin de l appel"].some((d) => t.startsWith(d))) {
      this.fermerApres = true; const p = bot.prenom;
      this.dire(hasard([`À plus tard ${p} !`, "Ciao, c'était cool de parler avec toi !", "Salut ! Reviens quand tu veux."])); return;
    }
    this.etat = "reflechit"; this.majTextes();
    ui.occupe = true;
    let rep;
    try { rep = await bot.repondre(this.texteToi); } catch (e) { rep = "Oups, j'ai eu un bug."; }
    ui.occupe = false;
    if (this.actif) this.dire(rep);
  },
  annoncer(t) { if (this.etat === "ecoute" || this.etat === "pause") { this.generation++; arreterEcoute(); this.dire(t); } else this.annonces.push(t); },
  toucherVisage() {
    if (this.etat === "parle") { arreterParole(); this.fermerApres = this.pauseApres = false; this.ecouter(); }
    else if (this.etat === "pause") { this.muet = false; this.silences = 0; this.majBoutons(); this.ecouter(); }
  },
  basculerMicro() {
    this.muet = !this.muet; this.majBoutons();
    if (this.muet && this.etat === "ecoute") { this.generation++; arreterEcoute(); this.etat = "pause"; this.majTextes(); }
    else if (!this.muet && this.etat === "pause") this.ecouter();
  },
  majBoutons() {
    $("#appel-micro").classList.toggle("coupe", this.muet);
    $("#appel-micro-txt").textContent = this.muet ? "Rallumer le micro" : "Couper le micro";
    $("#appel-cc").classList.toggle("coupe", !this.sousTitres);
  },
  majTextes() {
    const statut = { accueil: "", parle: "", ecoute: "Je t'écoute…", reflechit: "Je réfléchis…", pause: this.muet ? "Micro coupé" : "En pause — touche le visage pour parler" }[this.etat];
    $("#appel-statut").textContent = statut;
    $("#appel-toi").textContent = this.sousTitres && this.texteToi ? `Toi : « ${this.texteToi} »` : "";
    $("#appel-lui").textContent = this.sousTitres && this.texteLui && this.etat !== "reflechit" ? versionOrale(this.texteLui, 230) : "";
  },
  boucle() {
    if (!this.actif) return;
    const now = Date.now();
    if (this.etat === "parle" && parleEncore()) { if (now >= this.prochain) { this.cible = hasard([0.15, 0.35, 0.6, 0.85, 1, 0.25, 0.7]); this.prochain = now + 70 + Math.random() * 90; } }
    else if (this.etat === "parle" && !window.speechSynthesis) { if (now >= this.prochain) { this.cible = hasard([0.2, 0.5, 0.9, 0.3]); this.prochain = now + 110; } }
    else this.cible = 0;
    this.bouche += (this.cible - this.bouche) * 0.45;
    this.phase += 0.12;
    const s = Math.round((now - this.debut) / 1000);
    $("#appel-chrono").textContent = `Appel avec Chatbot · ${deux(Math.floor(s / 60))}:${deux(s % 60)}`;
    this.dessiner();
    requestAnimationFrame(() => setTimeout(() => this.boucle(), 30));
  },
  dessiner() {
    const scene = $("#appel-scene"), taille = Math.max(160, Math.min(scene.clientWidth, scene.clientHeight, 420));
    const c = $("#appel-visage"), ctx = preparerCanvas(c, taille), accent = accentActuel();
    const cx = taille / 2, cy = taille / 2, face = taille * 0.56;
    const melange = (a, alpha) => { ctx.globalAlpha = alpha; ctx.strokeStyle = a; };
    ctx.lineWidth = 2.5;
    if (this.etat === "parle") for (let k = 0; k < 3; k++) { const r = face / 2 + 12 + k * 18 + this.bouche * (8 + k * 7); melange(accent, 0.7 - k * 0.2); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke(); }
    else if (this.etat === "ecoute") for (let k = 0; k < 3; k++) { const t = (this.phase * 0.35 + k / 3) % 1, r = face / 2 + 6 + t * taille * 0.18; melange("#3ddc97", 0.85 * (1 - t)); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke(); }
    else if (this.etat === "reflechit") for (let k = 0; k < 8; k++) { const a = this.phase * 1.6 + k * Math.PI / 4, r = face / 2 + 22, tl = 3 + 4 * (((k + Math.floor(this.phase * 4)) % 8) / 8); ctx.globalAlpha = 0.9; ctx.fillStyle = "#c9c7ff"; ctx.beginPath(); ctx.arc(cx + r * Math.cos(a), cy + r * Math.sin(a), tl, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;
    const o = optAvatar(this.etat === "reflechit" ? "reflechit" : "content");
    o.bouche = this.etat === "parle" ? this.bouche : null;
    o.ferme = this.etat !== "parle" && (this.phase % 9) < 0.15;
    dessinerVisage(ctx, cx - face / 2, cy - face / 2, face, o);
  },
  raccrocher() {
    if (!this.actif) return;
    this.actif = false; this.generation++;
    arreterParole(); arreterEcoute();
    try { this.verrou && this.verrou.release(); } catch (e) { /* rien */ }
    $("#appel").hidden = true;
    ui.occupe = false;
    const s = Math.round((Date.now() - this.debut) / 1000);
    afficherDiscussion(); rendreListe();
    toast(`📞 Appel terminé (${Math.floor(s / 60)} min ${deux(s % 60)} s) · tout est écrit dans la discussion`, 4000);
  },
};
$("#appel-visage").addEventListener("click", () => appel.toucherVisage());
$("#appel-micro").onclick = () => appel.basculerMicro();
$("#appel-cc").onclick = () => { appel.sousTitres = !appel.sousTitres; appel.majBoutons(); appel.majTextes(); };
$("#appel-fin").onclick = () => appel.raccrocher();
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && appel.actif) appel.raccrocher(); });

demarrer();

</script>
