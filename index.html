<title>Mon Chatbot</title>
<style>
/* Mise en page : une seule colonne de discussion (comme l'appli PC), la liste des discussions en tiroir
   sur téléphone et en colonne fixe sur grand écran. Couleurs reprises du thème « clair » et « sombre » du PC. */
:root {
  --fond: #faf9f6; --tiroir: #f1efe9; --bordure: #e3e0d7; --texte: #1f1d1a; --muet: #8c877d;
  --accent: #5b5bd6; --accent-doux: #e7e7fb; --sur-accent: #ffffff; --bulle-bot: #ffffff; --champ: #ffffff;
  --survol: #e8e5dc; --actif: #e2ded3; --code-fond: #f1efe9; --code-texte: #3b3a36; --danger: #d64545; --succes: #2f9e66;
  --toast: #2a2833; --texte-toast: #ffffff; --ombre: 0 1px 2px rgba(31, 29, 26, .06), 0 4px 14px rgba(31, 29, 26, .05);
  --s-cle: #8b3fd1; --s-fn: #0e7f8a; --s-str: #2f8a4a; --s-nb: #c2620c; --s-com: #9a9488; --s-nom: #2563c9; --s-balise: #c23b5a; --s-attr: #c2620c;
  --police: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, Ubuntu, sans-serif;
  --mono: "Cascadia Mono", Consolas, ui-monospace, Menlo, "DejaVu Sans Mono", monospace;
  --taille: 15px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #18181b; --tiroir: #111113; --bordure: #2c2c32; --texte: #ececef; --muet: #8b8b95;
    --accent-doux: #26264a; --bulle-bot: #232328; --champ: #232328; --survol: #1d1d21; --actif: #26262c;
    --code-fond: #16161a; --code-texte: #d6d6dc; --danger: #ef6b6b; --succes: #4cc38a; --toast: #ececef; --texte-toast: #18181b;
    --ombre: 0 1px 2px rgba(0, 0, 0, .3);
    --s-cle: #c79bff; --s-fn: #6fd3dc; --s-str: #8bd49c; --s-nb: #f0a35e; --s-com: #7c7c88; --s-nom: #7fb2ff; --s-balise: #ff8fa8; --s-attr: #f0a35e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fond: #18181b; --tiroir: #111113; --bordure: #2c2c32; --texte: #ececef; --muet: #8b8b95;
  --accent-doux: #26264a; --bulle-bot: #232328; --champ: #232328; --survol: #1d1d21; --actif: #26262c;
  --code-fond: #16161a; --code-texte: #d6d6dc; --danger: #ef6b6b; --succes: #4cc38a; --toast: #ececef; --texte-toast: #18181b;
  --ombre: 0 1px 2px rgba(0, 0, 0, .3);
  --s-cle: #c79bff; --s-fn: #6fd3dc; --s-str: #8bd49c; --s-nb: #f0a35e; --s-com: #7c7c88; --s-nom: #7fb2ff; --s-balise: #ff8fa8; --s-attr: #f0a35e;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--fond); color: var(--texte); font: var(--taille)/1.5 var(--police); -webkit-tap-highlight-color: transparent; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { display: flex; height: 100%; }

/* ---- tiroir des discussions */
#tiroir { width: 280px; flex: none; background: var(--tiroir); border-right: 1px solid var(--bordure); display: flex; flex-direction: column; min-height: 0; }
.tiroir-haut { display: flex; align-items: center; gap: 10px; padding: 14px 14px 8px; }
.tiroir-haut strong { font-size: 17px; flex: 1; }
.btn-nouveau { margin: 6px 12px 8px; padding: 10px; border: 0; border-radius: 10px; background: var(--accent); color: var(--sur-accent); font-weight: 600; }
.recherche { margin: 0 12px 10px; padding: 9px 12px; border: 1px solid var(--bordure); border-radius: 10px; background: var(--champ); color: var(--texte); font: inherit; font-size: 14px; }
#liste { flex: 1; overflow-y: auto; padding: 0 8px 8px; min-height: 0; }
.groupe { font-size: 11px; font-weight: 700; color: var(--muet); text-transform: uppercase; letter-spacing: .06em; margin: 14px 10px 4px; }
.disc { display: flex; align-items: center; gap: 4px; border-radius: 8px; }
.disc button.ouvrir { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 9px 10px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 8px; }
.disc:hover, .disc.active { background: var(--actif); }
.disc.active button.ouvrir { font-weight: 600; }
.disc .plus { background: none; border: 0; color: var(--muet); padding: 6px 9px; border-radius: 6px; visibility: hidden; }
.disc:hover .plus, .disc.active .plus { visibility: visible; }
.tiroir-bas { border-top: 1px solid var(--bordure); padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
.profil { display: flex; align-items: center; gap: 10px; }
.pastille { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-doux); color: var(--accent); display: grid; place-items: center; font-weight: 700; flex: none; }
.profil small { display: block; color: var(--muet); font-size: 12px; }
.outils { display: flex; gap: 2px; }
.icone { background: none; border: 0; border-radius: 8px; padding: 7px 9px; color: var(--muet); font-size: 17px; line-height: 1; }
.icone:hover { background: var(--survol); color: var(--texte); }
#voile { display: none; }

/* ---- zone principale */
main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.entete { display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top, 0px)) 14px 8px; border-bottom: 1px solid var(--bordure); background: var(--fond); }
#btn-menu { display: none; }
#titre { flex: 1; min-width: 0; font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-appel { border: 0; border-radius: 999px; background: var(--accent); color: var(--sur-accent); padding: 6px 13px; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.btn-appel svg { width: 15px; height: 15px; }
#fil { flex: 1; overflow-y: auto; padding: 16px 16px 8px; min-height: 0; scroll-behavior: smooth; }
.colonne { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

/* ---- accueil */
.accueil { text-align: center; padding: 6vh 8px 12px; display: grid; justify-items: center; gap: 6px; }
.accueil h1 { font-size: 26px; margin: 12px 0 0; text-wrap: balance; }
.accueil p { color: var(--muet); margin: 0 0 14px; max-width: 46ch; }
.puces-accueil { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 600px; }
.puce { border: 1px solid var(--bordure); background: var(--champ); border-radius: 999px; padding: 7px 14px; font-size: 14px; }
.puce:hover { border-color: var(--accent); color: var(--accent); }

/* ---- messages */
.msg { display: flex; gap: 10px; align-items: flex-start; }
.msg.user { justify-content: flex-end; }
.msg .av { flex: none; margin-top: 2px; }
.contenu { min-width: 0; max-width: min(620px, 86%); display: flex; flex-direction: column; }
.msg.user .contenu { align-items: flex-end; }
.bulle { padding: 9px 14px; border-radius: 16px; background: var(--bulle-bot); border: 1px solid var(--bordure); overflow-wrap: anywhere; min-width: 0; max-width: 100%; }
.msg.user .bulle { background: var(--accent); color: var(--sur-accent); border-color: var(--accent); border-bottom-right-radius: 6px; white-space: pre-wrap; }
.msg.bot .bulle { border-top-left-radius: 6px; }
.bulle p { margin: 0; }
.bulle .vide { height: 8px; }
.bulle .titre { font-weight: 700; font-size: 1.05em; }
.bulle ul, .bulle ol { margin: 2px 0; padding-left: 22px; }
.bulle li.suite { list-style: none; }
.bulle a { color: var(--accent); font-weight: 600; }
.msg.user .bulle a { color: inherit; }
.bulle code { font-family: var(--mono); font-size: .88em; background: var(--code-fond); padding: 1px 5px; border-radius: 5px; }
.msg.user .bulle code { background: rgba(255, 255, 255, .18); }
.code { margin: 6px 0; border-radius: 10px; background: var(--code-fond); border: 1px solid var(--bordure); overflow: hidden; }
.code pre { margin: 0; padding: 10px 12px; overflow-x: auto; font: 13px/1.5 var(--mono); color: var(--code-texte); }
.code-actions { display: flex; gap: 4px; justify-content: flex-end; padding: 0 6px 6px; }
.code-actions button { border: 1px solid var(--bordure); background: var(--champ); border-radius: 7px; padding: 3px 10px; font-size: 12px; }
.code-actions button[data-lancer] { background: var(--accent); color: var(--sur-accent); border-color: var(--accent); }
.s-cle { color: var(--s-cle); } .s-fn { color: var(--s-fn); } .s-str { color: var(--s-str); } .s-nb { color: var(--s-nb); } .s-com { color: var(--s-com); font-style: italic; } .s-nom { color: var(--s-nom); } .s-balise { color: var(--s-balise); } .s-attr { color: var(--s-attr); }
.pied { display: flex; gap: 2px; align-items: center; font-size: 11.5px; color: var(--muet); margin: 3px 4px 0; flex-wrap: wrap; }
.pied button { background: none; border: 0; color: var(--muet); font-size: 11.5px; padding: 2px 6px; border-radius: 6px; }
.pied button:hover { background: var(--survol); color: var(--texte); }
.choix { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 7px; }
.choix button { border: 1px solid var(--accent); background: var(--champ); color: var(--texte); border-radius: 999px; padding: 6px 15px; font-weight: 600; font-size: 14px; }
.choix button:hover { background: var(--accent); color: var(--sur-accent); }
.ecrit .bulle { display: flex; gap: 5px; padding: 13px 16px; }
.ecrit span { width: 7px; height: 7px; border-radius: 50%; background: var(--bordure); animation: point 1s infinite; }
.ecrit span:nth-child(2) { animation-delay: .15s; } .ecrit span:nth-child(3) { animation-delay: .3s; }
@keyframes point { 0%, 60%, 100% { background: var(--bordure); transform: none; } 30% { background: var(--accent); transform: translateY(-3px); } }
.date-sep { text-align: center; font-size: 12px; color: var(--muet); margin: 4px 0; }

/* ---- saisie */
.saisie { padding: 6px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--fond); }
.saisie .colonne { gap: 6px; }
#suggestions { display: grid; gap: 2px; background: var(--champ); border: 1px solid var(--bordure); border-radius: 12px; padding: 6px; box-shadow: var(--ombre); max-height: 40vh; overflow-y: auto; }
#suggestions button { display: flex; gap: 10px; text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 8px; font-size: 14px; }
#suggestions button:hover, #suggestions button.sel { background: var(--survol); }
#suggestions b { color: var(--accent); min-width: 88px; }
#suggestions span { color: var(--muet); }
.champ { display: flex; align-items: flex-end; gap: 6px; background: var(--champ); border: 1px solid var(--bordure); border-radius: 16px; padding: 6px 6px 6px 14px; box-shadow: var(--ombre); }
.champ:focus-within { border-color: var(--accent); }
#texte { flex: 1; border: 0; background: none; resize: none; font: inherit; color: var(--texte); max-height: 160px; padding: 7px 0; outline: none; min-width: 0; }
#texte::placeholder { color: var(--muet); }
.rond { width: 38px; height: 38px; border-radius: 50%; border: 0; display: grid; place-items: center; flex: none; background: none; color: var(--muet); }
.rond svg { width: 20px; height: 20px; }
#btn-envoyer { background: var(--accent); color: var(--sur-accent); }
#btn-envoyer:disabled { opacity: .45; }
#btn-micro.ecoute { background: var(--danger); color: #fff; animation: respire 1.2s infinite; }
@keyframes respire { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--danger) 25%, transparent); } }
.astuce { text-align: center; font-size: 11.5px; color: var(--muet); margin: 0; }

/* ---- feuilles (réglages, mémoire…) */
#feuille-fond { position: fixed; inset: 0; background: rgba(15, 14, 20, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
#feuille { background: var(--fond); width: min(560px, 100%); max-height: 88vh; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgba(0, 0, 0, .2); }
.feuille-haut { display: flex; align-items: center; gap: 8px; padding: 16px 18px 8px; }
.feuille-haut h2 { margin: 0; font-size: 19px; flex: 1; }
.feuille-corps { overflow-y: auto; padding: 4px 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.section h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muet); margin: 6px 2px 6px; }
.carte { background: var(--champ); border: 1px solid var(--bordure); border-radius: 12px; }
.ligne { display: flex; align-items: center; gap: 12px; padding: 11px 14px; flex-wrap: wrap; }
.ligne + .ligne { border-top: 1px solid var(--bordure); }
.ligne > div:first-child { flex: 1; min-width: 150px; }
.ligne small { display: block; color: var(--muet); font-size: 12.5px; }
.segments { display: flex; flex-wrap: wrap; background: var(--tiroir); border-radius: 9px; padding: 3px; gap: 2px; }
.segments button { border: 0; background: none; padding: 5px 10px; border-radius: 7px; font-size: 13px; }
.segments button.oui { background: var(--champ); box-shadow: var(--ombre); font-weight: 600; }
.couleurs { display: flex; gap: 8px; flex-wrap: wrap; }
.couleurs button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; outline: 2px solid transparent; }
.couleurs button.oui { outline-color: var(--texte); border-color: var(--fond); }
.interrupteur { width: 44px; height: 26px; border-radius: 999px; border: 0; background: var(--bordure); position: relative; flex: none; }
.interrupteur::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); }
.interrupteur[aria-checked="true"] { background: var(--accent); }
.interrupteur[aria-checked="true"]::after { transform: translateX(18px); }
.bouton { border: 1px solid var(--bordure); background: var(--champ); border-radius: 9px; padding: 7px 13px; font-size: 14px; }
.bouton.principal { background: var(--accent); border-color: var(--accent); color: var(--sur-accent); font-weight: 600; }
.bouton.danger { color: var(--danger); }
.entree { border: 1px solid var(--bordure); background: var(--fond); color: var(--texte); border-radius: 9px; padding: 8px 11px; font: inherit; font-size: 14px; min-width: 0; }
.kv { display: grid; grid-template-columns: minmax(90px, auto) 1fr; gap: 6px 14px; padding: 12px 14px; }
.kv dt { color: var(--muet); } .kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.barre { height: 8px; border-radius: 99px; background: var(--accent-doux); overflow: hidden; }
.barre i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.stat { display: grid; grid-template-columns: 110px 1fr 34px; align-items: center; gap: 10px; padding: 6px 14px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.note { display: flex; gap: 10px; align-items: center; padding: 9px 14px; }
.note + .note { border-top: 1px solid var(--bordure); }
.note.fait span { text-decoration: line-through; color: var(--muet); }
.note input { width: 18px; height: 18px; accent-color: var(--accent); }
.note span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.texte-copie { width: 100%; box-sizing: border-box; min-height: 120px; font: 12px/1.4 var(--mono); }
.menu-disc { display: grid; padding: 4px; }
.menu-disc button { text-align: left; background: none; border: 0; padding: 12px 14px; border-radius: 9px; font-size: 15px; }
.menu-disc button:hover { background: var(--survol); }

/* ---- appel */
#appel { position: fixed; inset: 0; z-index: 30; background: #13121c; color: #fff; display: flex; flex-direction: column; align-items: center; }
#appel-haut { padding: calc(18px + env(safe-area-inset-top, 0px)) 16px 0; color: #a7a5b8; font-size: 14px; display: flex; align-items: center; gap: 8px; }
#appel-haut i { width: 8px; height: 8px; border-radius: 50%; background: #3ddc97; }
#appel-scene { flex: 1; width: 100%; min-height: 0; display: grid; place-items: center; }
#appel-visage { max-width: 100%; touch-action: manipulation; cursor: pointer; }
#appel-statut { font-size: 19px; font-weight: 700; min-height: 1.4em; text-align: center; }
#appel-toi { color: #a7a5b8; font-style: italic; text-align: center; padding: 0 20px; min-height: 1.4em; max-width: 640px; }
#appel-lui { text-align: center; padding: 0 20px; max-width: 640px; min-height: 3em; font-size: 16px; }
#appel-boutons { display: flex; gap: 26px; padding: 18px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
#appel-boutons button { width: 60px; height: 60px; border-radius: 50%; border: 0; background: #3a3850; color: #fff; display: grid; place-items: center; font-weight: 800; }
#appel-boutons button svg { width: 26px; height: 26px; }
#appel-boutons button.coupe { background: #6b2b37; }
#appel-boutons button.rouge { background: #e5484d; }
#appel-boutons label { display: grid; justify-items: center; gap: 6px; font-size: 11px; color: #a7a5b8; }

#toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--toast); color: var(--texte-toast); padding: 9px 16px; border-radius: 10px; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); box-shadow: var(--ombre); }

@media (max-width: 899px) {
  #tiroir { position: fixed; inset: 0 auto 0 0; z-index: 15; width: min(300px, 84vw); transform: translateX(-102%); transition: transform .2s; padding-top: env(safe-area-inset-top, 0px); }
  #app.tiroir-ouvert #tiroir { transform: none; box-shadow: 0 0 40px rgba(0, 0, 0, .25); }
  #app.tiroir-ouvert #voile { display: block; position: fixed; inset: 0; background: rgba(15, 14, 20, .4); z-index: 14; }
  #btn-menu { display: grid; }
  .disc .plus { visibility: visible; }
  #fil { padding-inline: 12px; }
  .saisie { padding-inline: 12px; }
  .contenu { max-width: 88%; }
}
@media (min-width: 900px) { #btn-fermer-tiroir { display: none; } #feuille-fond { align-items: center; } #feuille { border-radius: 18px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
@media (max-width: 600px) { .astuce { display: none; } }

/* ---- numéros de ligne dans les blocs de code */
.code-int { display: flex; }
.code-int pre { flex: 1; min-width: 0; }
.code .num { padding: 10px 0 10px 10px; font: 13px/1.5 var(--mono); color: var(--muet); text-align: right; white-space: pre; user-select: none; opacity: .75; }
.code-actions button[data-pas] { background: var(--accent-doux); }
/* ---- l'éditeur de code */
.btn-editeur { font: 700 13px var(--mono); color: var(--muet); }
#feuille.large { width: min(900px, 100%); height: 92vh; max-height: 92vh; }
#feuille.large .feuille-corps { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
.ed-outils { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ed-outils .bouton, .ed-bas .bouton { padding: 6px 10px; font-size: 13px; }
.ed-nom { flex: 1; color: var(--muet); font-size: 13px; min-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-cadre { flex: 1; min-height: 180px; display: flex; border: 1px solid var(--bordure); border-radius: 10px; background: var(--code-fond); overflow: hidden; }
.ed-num { padding: 10px 6px 10px 8px; font: 14px/1.5 var(--mono); color: var(--muet); text-align: right; white-space: pre; overflow: hidden; user-select: none; min-width: 2.2em; border-right: 1px solid var(--bordure); opacity: .8; }
.ed-pile { position: relative; flex: 1; min-width: 0; }
.ed-couleurs, .ed-zone { position: absolute; inset: 0; margin: 0; padding: 10px 12px; font: 14px/1.5 var(--mono); white-space: pre; overflow: auto; tab-size: 4; letter-spacing: 0; border: 0; }
.ed-couleurs { color: var(--code-texte); pointer-events: none; scrollbar-width: none; }
.ed-couleurs::-webkit-scrollbar { display: none; }
.ed-zone { background: transparent; color: transparent; caret-color: var(--texte); resize: none; outline: none; -webkit-text-fill-color: transparent; }
.ed-zone::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); -webkit-text-fill-color: transparent; }
.ed-statut { font-size: 12.5px; color: var(--muet); min-height: 1.3em; }
.ed-statut.erreur { color: var(--danger); }
.ed-statut.ok { color: var(--succes, #2f9e66); }
.ed-touches { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.ed-touches button { flex: none; min-width: 38px; height: 34px; border: 1px solid var(--bordure); background: var(--champ); border-radius: 8px; font: 600 14px var(--mono); color: var(--texte); }
.ed-bas { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ed-espace { flex: 1; }
@media (min-width: 900px) { .ed-touches { display: none; } }
.ed-zone:focus-visible { outline: none; }
.ed-cadre:focus-within { border-color: var(--accent); }
/* ---- l'éditeur façon Visual Studio Code */
body.ide-actif { overflow: hidden; }
.ide { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; background: #1e1e1e; color: #d4d4d4; font-size: 13px; }
.ide-barre { display: flex; align-items: stretch; background: #252526; min-height: 40px; overflow-x: auto; scrollbar-width: none; padding-top: env(safe-area-inset-top, 0px); }
.ide-onglet { display: flex; align-items: center; padding: 0 14px; background: #1e1e1e; color: #fff; white-space: nowrap; border-top: 2px solid #007acc; }
.ide-espace { flex: 1; }
.ide-btn { background: none; border: 0; color: #cccccc; padding: 0 11px; font-size: 14px; white-space: nowrap; min-height: 36px; }
.ide-btn:hover { background: #3c3c3c; }
.ide-btn.vert { color: #89d185; font-weight: 600; }
.ide-btn.stop { color: #f48771; }
.ide-btn.fermer { font-size: 16px; }
.ide-code { flex: 1; min-height: 120px; display: flex; overflow: hidden; }
.ide-num { padding: 8px 10px 8px 6px; min-width: 3em; font: 14px/1.55 var(--mono); color: #858585; text-align: right; white-space: pre; overflow: hidden; user-select: none; }
.ide-pile { position: relative; flex: 1; min-width: 0; }
.ide-ligne { position: absolute; left: 0; right: 0; background: #2a2d2e; pointer-events: none; }
.ide-couleurs, .ide-zone { position: absolute; inset: 0; margin: 0; padding: 8px 10px; font: 14px/1.55 var(--mono); white-space: pre; overflow: auto; tab-size: 4; border: 0; letter-spacing: 0; }
.ide-couleurs { color: #d4d4d4; pointer-events: none; scrollbar-width: none; }
.ide-couleurs::-webkit-scrollbar { display: none; }
.ide-zone { background: transparent; color: transparent; -webkit-text-fill-color: transparent; caret-color: #aeafad; resize: none; outline: none; }
.ide-zone::selection { background: rgba(38, 79, 120, .85); }
.ide .s-cle { color: #c586c0; } .ide .s-fn { color: #dcdcaa; } .ide .s-str { color: #ce9178; } .ide .s-nb { color: #b5cea8; }
.ide .s-com { color: #6a9955; } .ide .s-nom { color: #4ec9b0; } .ide .s-attr { color: #9cdcfe; } .ide .s-balise { color: #569cd6; }
.ide-complet { position: absolute; z-index: 3; width: min(340px, 90%); background: #252526; border: 1px solid #454545; box-shadow: 0 4px 14px rgba(0, 0, 0, .5); font: 13px/1.4 var(--mono); }
.ide-c-liste { max-height: 168px; overflow-y: auto; }
.ide-c-item { display: flex; gap: 8px; padding: 2px 8px; cursor: pointer; white-space: nowrap; }
.ide-c-item.actif { background: #04395e; color: #fff; }
.ide-c-ic { width: 1.3em; text-align: center; flex: none; }
.ide-c-desc { border-top: 1px solid #454545; padding: 4px 8px; color: #9d9d9d; font: 12px/1.35 system-ui, sans-serif; white-space: normal; }
.ide-touches { display: flex; gap: 5px; overflow-x: auto; padding: 5px 8px; background: #252526; scrollbar-width: none; }
.ide-touches button { flex: none; min-width: 40px; height: 34px; border: 1px solid #3c3c3c; background: #333333; color: #d4d4d4; border-radius: 6px; font: 600 14px var(--mono); }
.ide-terminal { height: 32%; min-height: 110px; display: flex; flex-direction: column; background: #181818; border-top: 1px solid #3c3c3c; }
.ide-t-haut { display: flex; align-items: center; gap: 10px; padding: 0 0 0 12px; font-size: 11px; letter-spacing: .5px; color: #cccccc; }
.ide-t-haut b { border-bottom: 1px solid #e7e7e7; padding: 7px 0 5px; }
.ide-t-etat { color: #89d185; }
.ide-sortie { flex: 1; overflow: auto; padding: 4px 12px 10px; font: 13px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; outline: none; }
.t-err { color: #f48771; } .t-info { color: #858585; } .t-aide { color: #dcdcaa; } .t-ok { color: #89d185; }
.t-lien { color: #3794ff; text-decoration: underline; cursor: pointer; }
.t-saisie { background: transparent; border: 0; border-bottom: 1px solid #3794ff; color: #9cdcfe; font: 13px var(--mono); outline: none; min-width: 8em; width: 40%; padding: 0 2px; }
.ide-etat { display: flex; justify-content: space-between; gap: 10px; background: #007acc; color: #fff; font-size: 11.5px; padding: 3px 10px calc(3px + env(safe-area-inset-bottom, 0px)); white-space: nowrap; overflow: hidden; }
.ide-etat span:first-child { overflow: hidden; text-overflow: ellipsis; }
.ide-etat.faute { background: #a1260d; }
@media (min-width: 900px) { .ide-touches { display: none; } }
.ide-zone:focus-visible { outline: none; }
/* ---- les images dans la discussion */
.image-bulle { margin: 6px 0; }
.image-bulle img { display: block; max-width: min(100%, 460px); border-radius: 10px; cursor: zoom-in; background: var(--code-fond); min-height: 40px; }
.image-grande { width: 100%; border-radius: 10px; }
.btn-photo { font-size: 18px; }
.statut-ia { font-size: 13px; margin: 0; padding: 8px 14px 12px; color: var(--muet); }
.statut-ia:empty { display: none; }
.astuce-cat { font-size: 12.5px; color: var(--muet); margin: 0; padding: 4px 14px 6px; line-height: 1.45; }

</style>

<body>
<div id="app">
  <aside id="tiroir" aria-label="Discussions">
    <div class="tiroir-haut">
      <canvas id="logo" width="30" height="30" aria-hidden="true"></canvas>
      <strong>Mon Chatbot</strong>
      <button class="icone" id="btn-fermer-tiroir" type="button" aria-label="Fermer">✕</button>
    </div>
    <button class="btn-nouveau" id="btn-nouveau" type="button">＋ Nouvelle discussion</button>
    <input class="recherche" id="recherche" type="search" placeholder="Rechercher…" aria-label="Rechercher une discussion">
    <nav id="liste"></nav>
    <div class="tiroir-bas">
      <div class="profil"><span class="pastille" id="pastille">?</span><div><strong id="nom-profil">Toi</strong><small id="info-profil">Mode normal</small></div></div>
      <div class="outils">
        <button class="icone" type="button" data-ouvrir="memoire" title="Ce que je sais sur toi" aria-label="Mémoire">🧠</button>
        <button class="icone" type="button" data-ouvrir="notes" title="Notes et agenda" aria-label="Notes et agenda">📝</button>
        <button class="icone" type="button" data-ouvrir="stats" title="Statistiques" aria-label="Statistiques">📊</button>
        <button class="icone" type="button" id="btn-theme" title="Thème clair / sombre" aria-label="Changer de thème">🌗</button>
        <button class="icone" type="button" data-ouvrir="reglages" title="Réglages" aria-label="Réglages">⚙</button>
      </div>
    </div>
  </aside>
  <div id="voile"></div>
  <main>
    <header class="entete">
      <button class="icone" id="btn-menu" type="button" aria-label="Ouvrir la liste des discussions">☰</button>
      <canvas id="avatar-entete" width="30" height="30" aria-hidden="true"></canvas>
      <div id="titre">Mon Chatbot</div>
      <button class="btn-appel" id="btn-appel" type="button" title="Se parler à voix haute, comme en face">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
        Appel
      </button>

    <div id="fil" aria-live="polite"><div class="colonne" id="messages"></div></div>
    <div class="saisie">
      <div class="colonne">
        <div id="suggestions" hidden></div>
        <div class="champ">
          <textarea id="texte" rows="1" placeholder="Écris ton message…" aria-label="Ton message"></textarea>
          <button class="rond btn-photo" id="btn-photo" type="button" aria-label="Envoyer une photo à retoucher" title="Une photo à retoucher">📷</button>
          <button class="rond btn-editeur" id="btn-editeur" type="button" aria-label="Éditeur de code" title="Éditeur de code">&lt;/&gt;</button>
          <button class="rond" id="btn-micro" type="button" aria-label="Parler au micro">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
          </button>
          <button class="rond" id="btn-envoyer" type="button" aria-label="Envoyer" disabled>
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 4l-7 7 1.4 1.4L11 7.8V20h2V7.8l4.6 4.6L19 11z"/></svg>
          </button>
        </div>
        <p class="astuce">Entrée pour envoyer · Maj+Entrée nouvelle ligne · tape <b>/</b> pour les commandes</p>
      </div>
    </div>
  </main>
</div>
<div id="feuille-fond" hidden><section id="feuille" role="dialog" aria-modal="true"></section></div>
<div id="appel" hidden>
  <div id="appel-haut"><i></i><span id="appel-chrono">Appel avec Chatbot · 00:00</span></div>
  <div id="appel-scene"><canvas id="appel-visage" aria-label="Le visage du chatbot. Touche-le pour parler ou pour lui couper la parole."></canvas></div>

  <div id="appel-toi"></div>
  <div id="appel-lui"></div>
  <div id="appel-boutons">
    <label><button type="button" id="appel-micro" aria-label="Couper le micro"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg></button><span id="appel-micro-txt">Couper le micro</span></label>

lle année l'homme a-t-il marché sur la Lune pour la première fois ?",["1969"]],["Quel est le symbole chimique de l'or ?",["au"]],["Quel langage de programmation a un serpent dans son logo ?",["python"]],["Combien font 7 x 8 ?",["56","cinquante six"]],["Quel est l'animal terrestre le plus rapide ?",["guepard"]],["Combien de joueurs a une équipe de foot sur le terrain ?",["11","onze"]],["Dans Minecraft, quel monstre vert explose ?",["creeper"]],["Quelle est la plus grande planète du système solaire ?",["jupiter"]],["Quel gaz les plantes absorbent-elles pour faire la photosynthèse ?",["co2","dioxyde de carbone","gaz carbonique"]],["Combien de côtés a un hexagone ?",["6","six"]],["Quel est le plus long fleuve de France ?",["loire","la loire"]],["Combien y a-t-il de minutes dans une journée ?",["1440"]]],"MOTS_MOTUS":["avion","balle","chien","table","pomme","livre","neige","sucre","plage","radio","lampe","tigre","fleur","jaune","verre","porte","route","train","piano","monde","ville","homme","arbre","carte","pizza","robot","sport","glace","nuage","frite","lapin","plume","salon","reine","golfe","piste","ecran","magie","tasse"],"FICHES":{"sommaire":{"exemples":["apprends moi python","cours de python","tu sais coder","tu connais python","je veux apprendre à coder","apprendre la programmation","tu peux m apprendre le code"],"texte":"🐍 **Avec plaisir ! Voici ce que je peux t'apprendre en Python :**\n- **Afficher du texte** : « quelle fonction pour afficher du texte ? »\n- **Demander quelque chose** : « comment demander le prénom ? »\n- **Variables, nombres et texte** : « c'est quoi une variable ? »\n- **Listes et dictionnaires** : « comment faire une liste ? »\n- **Conditions** : « comment faire un if ? »\n- **Boucles** : « comment faire une boucle ? »\n- **Fonctions et classes** : « comment créer une fonction ? »\n- **Fichiers, hasard, erreurs, modules, fenêtres Tkinter**…\n\nEt je peux **générer du code** pour toi :\n- « fais une boucle de 1 à 20 »\n- « crée une fonction bonjour avec un paramètre nom »\n- « fais une liste de fruits : pomme, banane, kiwi en python »\n- « crée une classe Joueur avec nom, vie et score »\n- « fais une page html avec un titre Mon site et un bouton »\n- « fais un jeu devine le nombre en python »"},"afficher":{"exemples":["quelle fonction pour afficher du texte","comment afficher du texte en python","c est quoi print","comment écrire du texte à l écran","afficher un message","écrire quelque chose dans la console","comment on affiche une variable","print en python"],"texte":"Pour **afficher du texte**, on utilise la fonction `print()` :\n```\nprint(\"Bonjour !\")\nprint(\"J'ai\", 15, \"ans\")        # plusieurs choses séparées par des virgules\nprint(\"Ligne 1\\nLigne 2\")       # \\n = retour à la ligne\n```\nOn peut aussi afficher une variable :\n```\nprenom = \"Mga\"\nprint(\"Salut\", prenom)\nprint(f\"Salut {prenom} !\")      # f-string : la variable va dans les { }\n```\n💡 Le texte se met toujours entre guillemets `\"...\"` ou `'...'`, les nombres non."},"demander":{"exemples":["comment demander quelque chose à l utilisateur","c est quoi input","comment lire ce que tape l utilisateur","demander le prénom","comment écrire du texte au clavier","récupérer une réponse de l utilisateur","input en python","poser une question à l utilisateur"],"texte":"Pour **demander quelque chose** à l'utilisateur, on utilise `input()` :\n```\nprenom = input(\"Comment tu t'appelles ? \")\nprint(\"Enchanté\", prenom)\n```\n⚠️ `input()` renvoie **toujours du texte**. Pour un nombre, il faut le convertir :\n```\nage = int(input(\"Quel âge as-tu ? \"))     # int() = nombre entier\ntaille = float(input(\"Ta taille en m ? \"))  # float() = nombre à virgule\nprint(\"Dans 10 ans tu auras\", age + 10, \"ans\")\n```"},"variables":{"exemples":["c est quoi une variable","comment créer une variable","les types en python","différence entre texte et nombre","stocker une valeur","c est quoi un int et un str"],"texte":"Une **variable**, c'est une boîte avec un nom, dans laquelle on range une valeur :\n```\nprenom = \"Mga\"        # str   : du texte\nage = 17              # int   : un nombre entier\ntaille = 1.78         # float : un nombre à virgule\ncontent = True        # bool  : vrai (True) ou faux (False)\n\nage = age + 1         # on peut changer la valeur\nprint(type(age))      # affiche le type : <class 'int'>\n```\n💡 Un nom de variable ne commence pas par un chiffre et n'a pas d'espace (`mon_score`, pas `mon score`)."},"conversion":{"exemples":["convertir du texte en nombre","transformer un nombre en texte","c est quoi int str float","erreur can only concatenate str","additionner un input","changer le type d une variable"],"texte":"Pour **convertir** d'un type à l'autre :\n```\ntexte = \"42\"\nnombre = int(texte)        # \"42\"  -> 42\nvirgule = float(\"3.5\")     # \"3.5\" -> 3.5\nretour = str(42)           # 42    -> \"42\"\n\nprint(\"Score : \" + str(100))   # pour coller du texte et un nombre avec +\n```\n💡 L'erreur `can only concatenate str (not \"int\") to str` veut dire que tu essaies de coller du texte et un nombre avec `+` : utilise `str()` ou une f-string."},"fstring":{"exemples":["mettre une variable dans un texte","c est quoi une f string","concaténer du texte","coller deux textes","insérer une variable dans une phrase","format en python"],"texte":"Pour **mettre des variables dans un texte**, le plus simple est la **f-string** (un `f` devant les guillemets) :\n```\nprenom = \"Mga\"\nage = 17\nprint(f\"Je m'appelle {prenom} et j'ai {age} ans\")\nprint(f\"Dans 5 ans : {age + 5} ans\")       # on peut calculer dedans\nprint(f\"Prix : {9.5:.2f} CHF\")              # 2 chiffres après la virgule\n```\nOn peut aussi coller du texte avec `+` : `\"Salut \" + prenom`"},"listes":{"exemples":["comment faire une liste","créer une liste en python","c est quoi une liste","ajouter un élément dans une liste","append en python","parcourir une liste","tableau en python","comment on fait des listes","mettre plusieurs valeurs dans une variable"],"texte":"Une **liste** range plusieurs valeurs dans l'ordre, entre crochets `[ ]` :\n```\nfruits = [\"pomme\", \"banane\", \"kiwi\"]\n\nprint(fruits[0])          # premier élément : pomme\nprint(fruits[-1])         # dernier élément : kiwi\nfruits.append(\"mangue\")   # ajouter à la fin\nfruits.remove(\"banane\")   # enlever un élément\nprint(len(fruits))        # nombre d'éléments : 3\n\nfor fruit in fruits:      # parcourir la liste\n    print(fruit)\n```\n💡 On compte à partir de **0** : le 1er élément est `fruits[0]`. Demande-moi « trier une liste » pour aller plus loin."},"listes_plus":{"exemples":["trier une liste","supprimer un élément d une liste","inverser une liste","chercher dans une liste","longueur d une liste","vérifier si un élément est dans une liste","maximum d une liste","somme d une liste"],"texte":"**Opérations utiles sur les listes :**\n```\nnotes = [12, 18, 9, 15]\n\nnotes.sort()                  # trier : [9, 12, 15, 18]\nnotes.reverse()               # inverser l'ordre\nprint(len(notes))             # longueur : 4\nprint(max(notes), min(notes)) # plus grand / plus petit\nprint(sum(notes))             # somme : 54\nprint(18 in notes)            # est-ce que 18 est dedans ? True\nnotes.pop()                   # enlève le dernier élément\ndel notes[0]                  # enlève l'élément n°0\nprint(notes[1:3])             # une « tranche » : éléments 1 et 2\n```"},"dictionnaires":{"exemples":["c est quoi un dictionnaire","comment faire un dictionnaire","dict en python","associer une clé et une valeur","stocker des infos sur un joueur","dictionnaire python"],"texte":"Un **dictionnaire** associe des **clés** à des **valeurs**, entre accolades `{ }` :\n```\njoueur = {\"nom\": \"Mga\", \"vie\": 100, \"score\": 0}\n\nprint(joueur[\"nom\"])        # lire une valeur : Mga\njoueur[\"score\"] = 50        # changer une valeur\njoueur[\"niveau\"] = 2        # ajouter une clé\n\nfor cle, valeur in joueur.items():\n    print(cle, \"=\", valeur)\n\nprint(joueur.get(\"arme\", \"aucune\"))   # valeur par défaut si la clé n'existe pas\n```"},"conditions":{"exemples":["comment faire une condition","c est quoi if","comment faire un if else","si alors en python","elif en python","vérifier une condition","comparer deux nombres","faire un test en python"],"texte":"Pour faire une **condition**, on utilise `if` (si), `elif` (sinon si) et `else` (sinon) :\n```\nage = int(input(\"Ton âge ? \"))\n\nif age >= 18:\n    print(\"Tu es majeur\")\nelif age >= 13:\n    print(\"Tu es ado\")\nelse:\n    print(\"Tu es enfant\")\n```\n**Comparaisons** : `==` égal · `!=` différent · `<` `>` `<=` `>=`\n**Combiner** : `and` (et) · `or` (ou) · `not` (pas)\n\n💡 N'oublie pas les **deux-points** `:` et le **décalage** (4 espaces) en dessous !"},"boucle_for":{"exemples":["comment faire une boucle","c est quoi une boucle for","répéter plusieurs fois","range en python","boucle for python","faire quelque chose 10 fois","compter de 1 à 10"],"texte":"La boucle `for` répète du code un certain nombre de fois :\n```\nfor i in range(5):          # i vaut 0, 1, 2, 3, 4\n    print(\"Tour\", i)\n\nfor i in range(1, 11):      # de 1 à 10 (le 11 est exclu !)\n    print(i)\n\nfor i in range(0, 20, 5):   # de 0 à 20 de 5 en 5 : 0, 5, 10, 15\n    print(i)\n\nfor lettre in \"Python\":     # on peut parcourir un texte ou une liste\n    print(lettre)\n```\n💡 Je peux t'en générer une : « fais une boucle de 1 à 50 »."},"boucle_while":{"exemples":["c est quoi une boucle while","boucle tant que","while en python","répéter tant que","boucle infinie","comment arrêter une boucle","break en python"],"texte":"La boucle `while` répète **tant qu'une condition est vraie** :\n```\nvie = 3\nwhile vie > 0:\n    print(\"Il te reste\", vie, \"vies\")\n    vie = vie - 1\nprint(\"Game over\")\n\nwhile True:                  # boucle infinie…\n    mot = input(\"Tape stop : \")\n    if mot == \"stop\":\n        break                # … qu'on arrête avec break\n```\n⚠️ Si la condition ne devient jamais fausse, la boucle tourne pour toujours !"},"fonctions":{"exemples":["comment créer une fonction","c est quoi une fonction","def en python","c est quoi return","faire une fonction avec des paramètres","définir une fonction","fonction python"],"texte":"Une **fonction** est un bout de code réutilisable, créé avec `def` :\n```\ndef dire_bonjour(prenom):\n    print(f\"Bonjour {prenom} !\")\n\ndire_bonjour(\"Mga\")       # on « appelle » la fonction\ndire_bonjour(\"Lucas\")\n\ndef addition(a, b):\n    return a + b           # return renvoie un résultat\n\nresultat = addition(3, 4)\nprint(resultat)           # 7\n```\n💡 Je peux t'en générer une : « crée une fonction calcul_score avec les paramètres points et bonus »."},"classes":{"exemples":["c est quoi une classe","comment créer une classe","programmation orientée objet","c est quoi init","c est quoi self","créer un objet en python","class en python"],"texte":"Une **classe** est un « modèle » pour créer des objets qui ont des données et des actions :\n```\nclass Joueur:\n    def __init__(self, nom, vie=100):   # appelée à la création\n        self.nom = nom\n        self.vie = vie\n\n    def prendre_degats(self, degats):\n        self.vie -= degats\n        print(f\"{self.nom} a encore {self.vie} PV\")\n\nj = Joueur(\"Mga\")            # on crée un objet\nj.prendre_degats(30)         # Mga a encore 70 PV\n```\n💡 `self` représente l'objet lui-même. Essaie : « crée une classe Voiture avec marque, couleur et vitesse »."},"fichiers":{"exemples":["comment lire un fichier","écrire dans un fichier","sauvegarder dans un fichier txt","ouvrir un fichier en python","open en python","enregistrer des données"],"texte":"**Écrire** et **lire** un fichier texte :\n```\n# écrire (le fichier est créé ou remplacé)\nwith open(\"notes.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"Ma première ligne\\n\")\n\n# ajouter à la fin\nwith open(\"notes.txt\", \"a\", encoding=\"utf-8\") as f:\n    f.write(\"Une autre ligne\\n\")\n\n# lire tout le fichier\nwith open(\"notes.txt\", \"r\", encoding=\"utf-8\") as f:\n    contenu = f.read()\nprint(contenu)\n```\n💡 `with` ferme le fichier tout seul. Pour sauvegarder des listes ou dictionnaires, regarde le module `json`."},"hasard":{"exemples":["comment faire un nombre aléatoire","random en python","choisir au hasard","tirer un dé","mélanger une liste","nombre au hasard"],"texte":"Pour le **hasard**, on importe le module `random` :\n```\nimport random\n\nde = random.randint(1, 6)                 # entier entre 1 et 6\nprint(\"Tu as fait\", de)\n\ncouleur = random.choice([\"rouge\", \"bleu\", \"vert\"])   # un élément au hasard\ncartes = [1, 2, 3, 4, 5]\nrandom.shuffle(cartes)                    # mélange la liste\nprint(random.random())                    # nombre à virgule entre 0 et 1\n```"},"erreurs":{"exemples":["comment gérer une erreur","try except","mon programme plante","éviter que ça crash","valueerror","attraper une erreur"],"texte":"Pour **éviter que le programme plante**, on utilise `try` / `except` :\n```\ntry:\n    age = int(input(\"Ton âge ? \"))\n    print(\"Dans 1 an :\", age + 1)\nexcept ValueError:\n    print(\"Ce n'est pas un nombre !\")\n```\n**Erreurs fréquentes :**\n- `SyntaxError` : faute d'écriture (oubli de `:` ou de parenthèse)\n- `IndentationError` : mauvais décalage\n- `NameError` : variable pas encore créée (ou faute de frappe)\n- `TypeError` : mauvais type (texte + nombre…)\n- `IndexError` : case de liste qui n'existe pas"},"modules":{"exemples":["c est quoi import","comment importer un module","utiliser une bibliothèque","les modules python","import en python","c est quoi pip"],"texte":"Un **module** apporte des fonctions toutes prêtes. On le charge avec `import` :\n```\nimport math\nprint(math.sqrt(16))        # racine carrée : 4.0\n\nfrom random import randint  # importer juste une fonction\nprint(randint(1, 10))\n\nimport time\ntime.sleep(2)               # attendre 2 secondes\n```\n**Modules utiles déjà inclus** : `math`, `random`, `time`, `datetime`, `os`, `json`, `tkinter`\n💡 `pip install nom` installe des modules en plus (mais ton chatbot n'en a besoin d'aucun !)."},"chaines":{"exemples":["manipuler du texte","mettre en majuscule","découper un texte","remplacer un mot dans un texte","longueur d un texte","split en python","chaine de caractères"],"texte":"**Travailler avec du texte** (on dit une « chaîne ») :\n```\nphrase = \"Bonjour le monde\"\n\nprint(phrase.upper())              # BONJOUR LE MONDE\nprint(phrase.lower())              # bonjour le monde\nprint(len(phrase))                 # nombre de caractères : 16\nprint(phrase.replace(\"monde\", \"Mga\"))\nmots = phrase.split(\" \")           # découpe : ['Bonjour', 'le', 'monde']\nprint(\" - \".join(mots))            # recolle : Bonjour - le - monde\nprint(phrase[0:7])                 # les 7 premiers caractères\nprint(\"monde\" in phrase)           # True\n```"},"maths":{"exemples":["les opérateurs en python","faire un calcul en python","division entière","modulo","puissance en python","arrondir un nombre","racine carrée"],"texte":"**Calculs en Python :**\n```\nprint(7 + 2)     # addition : 9\nprint(7 - 2)     # soustraction : 5\nprint(7 * 2)     # multiplication : 14\nprint(7 / 2)     # division : 3.5\nprint(7 // 2)    # division entière : 3\nprint(7 % 2)     # modulo (le reste) : 1   -> pratique pour pair/impair\nprint(7 ** 2)    # puissance : 49\nprint(round(3.14159, 2))   # arrondi : 3.14\nprint(abs(-5))   # valeur absolue : 5\n```"},"tkinter":{"exemples":["comment faire une fenêtre","tkinter","créer une interface graphique","faire un bouton en python","fenêtre avec un bouton","interface en python"],"texte":"Pour faire une **fenêtre**, on utilise **Tkinter** (déjà inclus avec Python, c'est ce qu'utilise ton chatbot !) :\n```\nimport tkinter as tk\n\ndef clic():\n    label.config(text=\"Tu as cliqué !\")\n\nfenetre = tk.Tk()\nfenetre.title(\"Ma fenêtre\")\nfenetre.geometry(\"300x200\")\n\nlabel = tk.Label(fenetre, text=\"Bonjour !\", font=(\"Arial\", 14))\nlabel.pack(pady=20)\ntk.Button(fenetre, text=\"Clique-moi\", command=clic).pack()\n\nfenetre.mainloop()\n```\n💡 Demande « fais une fenêtre tkinter avec le titre Mon jeu » pour un modèle personnalisé."},"temps":{"exemples":["attendre en python","time sleep","afficher la date en python","datetime","mettre une pause","chronomètre en python"],"texte":"**Le temps en Python :**\n```\nimport time\nfrom datetime import datetime\n\nprint(\"Attends…\")\ntime.sleep(2)                      # pause de 2 secondes\n\nmaintenant = datetime.now()\nprint(maintenant.strftime(\"%d/%m/%Y %H:%M\"))   # 06/10/2026 18:55\n\ndebut = time.time()\n# … du code …\nprint(\"Durée :\", time.time() - debut, \"secondes\")\n```"},"commentaires":{"exemples":["comment faire un commentaire","c est quoi un commentaire","mettre une note dans le code","dièse en python"],"texte":"Un **commentaire** est ignoré par Python : il sert à expliquer ton code.\n```\n# Ceci est un commentaire sur une ligne\nscore = 0   # on peut aussi le mettre en fin de ligne\n\n\"\"\"\nCeci est un texte sur plusieurs lignes,\nsouvent utilisé pour expliquer une fonction.\n\"\"\"\n```"},"html":{"exemples":["comment faire une page html","c est quoi le html","créer un site web","les balises html","faire un site internet","html de base"],"texte":"Une **page HTML** de base (enregistre-la en `.html` et ouvre-la dans ton navigateur) :\n```\n<!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Mon site<\/title>\n<\/head>\n<body>\n  <h1>Bienvenue !<\/h1>\n  <p>Mon premier paragraphe.<\/p>\n  <a href=\"https://zyntracode.ch\">Un lien<\/a>\n  <button onclick=\"alert('Salut !')\">Clique<\/button>\n<\/body>\n<\/html>\n```\n💡 Balises utiles : `<h1>` titre · `<p>` paragraphe · `<img>` image · `<a>` lien · `<div>` bloc · `<ul><li>` liste"},"javascript":{"exemples":["c est quoi le javascript","afficher du texte en javascript","console log","bases du javascript","variable en javascript","apprendre le js"],"texte":"Les **bases du JavaScript** :\n```\nlet prenom = \"Mga\";            // variable modifiable\nconst age = 17;                // constante\nconsole.log(\"Salut \" + prenom);   // afficher dans la console\nalert(`J'ai ${age} ans`);         // fenêtre pop-up\n\nif (age >= 18) {\n  console.log(\"Majeur\");\n} else {\n  console.log(\"Mineur\");\n}\n\nfor (let i = 1; i <= 5; i++) {\n  console.log(i);\n}\n\nfunction addition(a, b) {\n  return a + b;\n}\n```\n💡 En JS on met des `;` et des accolades `{ }`, alors qu'en Python c'est le décalage qui compte."}},"MOTS_CODE":["algorithme","append","balise","balises","boucle","boucles","chaine","classe","classes","code","coder","condition","conditions","console","css","def","dict","dictionnaire","dictionnaires","elif","else","except","fichier","fichiers","float","fonction","fonctions","for","fstring","html","if","import","init","input","int","javascript","js","liste","listes","module","modules","pip","print","programmation","programme","programmer","python","random","range","return","script","self","split","str","string","tableau","tkinter","try","variable","variables","while"],"MOTS_DEMANDE":["affiche","afficher","aide","apprendre","apprends","code","comment","cree","creer","demander","difference","dire","donne","ecrire","ecris","exemple","exemples","explique","expliquer","faire","fais","fait","genere","generer","montre","montrer","quel","quelle","quelles","quels","quoi","sert","signifie","utilise","utiliser","veut"],"PROGRAMMES":{"devine":["un jeu **devine le nombre**","import random\n\nnombre = random.randint(1, 100)\nessais = 0\nprint(\"J'ai choisi un nombre entre 1 et 100 !\")\n\nwhile True:\n    choix = int(input(\"Ton nombre : \"))\n    essais += 1\n    if choix < nombre:\n        print(\"C'est plus !\")\n    elif choix > nombre:\n        print(\"C'est moins !\")\n    else:\n        print(f\"Bravo ! Trouvé en {essais} essais 🎉\")\n        break"],"calculatrice":["une **calculatrice**","a = float(input(\"Premier nombre : \"))\noperation = input(\"Opération (+ - * /) : \")\nb = float(input(\"Deuxième nombre : \"))\n\nif operation == \"+\":\n    print(\"Résultat :\", a + b)\nelif operation == \"-\":\n    print(\"Résultat :\", a - b)\nelif operation == \"*\":\n    print(\"Résultat :\", a * b)\nelif operation == \"/\":\n    if b == 0:\n        print(\"Impossible de diviser par zéro !\")\n    else:\n        print(\"Résultat :\", a / b)\nelse:\n    print(\"Opération inconnue\")"],"pierre":["un **pierre-feuille-ciseaux**","import random\n\nchoix = [\"pierre\", \"feuille\", \"ciseaux\"]\ngagne_contre = {\"pierre\": \"ciseaux\", \"feuille\": \"pierre\", \"ciseaux\": \"feuille\"}\n\njoueur = input(\"pierre, feuille ou ciseaux ? \").lower()\nordi = random.choice(choix)\nprint(\"L'ordinateur a choisi :\", ordi)\n\nif joueur == ordi:\n    print(\"Égalité !\")\nelif gagne_contre.get(joueur) == ordi:\n    print(\"Tu as gagné ! 🎉\")\nelse:\n    print(\"Tu as perdu…\")"],"quiz":["un petit **quiz**","questions = [\n    (\"Quelle est la capitale de la Suisse ?\", \"berne\"),\n    (\"Combien font 7 x 8 ?\", \"56\"),\n    (\"Quel langage a un serpent pour logo ?\", \"python\"),\n]\nscore = 0\n\nfor question, reponse in questions:\n    if input(question + \" \").strip().lower() == reponse:\n        print(\"Bonne réponse ✅\")\n        score += 1\n    else:\n        print(\"Raté ❌ La réponse était\", reponse)\n\nprint(f\"Score : {score}/{len(questions)}\")"],"todo":["une **liste de tâches**","taches = []\n\nwhile True:\n    action = input(\"(a)jouter, (v)oir, (s)upprimer, (q)uitter : \")\n    if action == \"a\":\n        taches.append(input(\"Nouvelle tâche : \"))\n    elif action == \"v\":\n        for i, tache in enumerate(taches, 1):\n            print(i, \"-\", tache)\n    elif action == \"s\":\n        numero = int(input(\"Numéro à supprimer : \"))\n        taches.pop(numero - 1)\n    elif action == \"q\":\n        break"],"mot_de_passe":["un **générateur de mot de passe**","import random\nimport string\n\nlongueur = int(input(\"Longueur du mot de passe : \"))\ncaracteres = string.ascii_letters + string.digits + \"!@#$%&*\"\nmot_de_passe = \"\".join(random.choice(caracteres) for _ in range(longueur))\nprint(\"Ton mot de passe :\", mot_de_passe)"]},"DEFIS":[{"id":"doubler","niveau":1,"points":5,"fonction":"doubler","parametres":"n","enonce":"Écris une fonction `doubler(n)` qui **renvoie** le double du nombre `n`.","tests":[[[3],6],[[0],0],[[-4],-8],[[2.5],5.0]],"indice":"Utilise `return` avec `n * 2`.","solution":"def doubler(n):\n    return n * 2"},{"id":"bonjour","niveau":1,"points":5,"fonction":"dire_bonjour","parametres":"prenom","enonce":"Écris une fonction `dire_bonjour(prenom)` qui **renvoie** le texte `\"Bonjour \"` suivi du prénom.\nExemple : `dire_bonjour(\"Mga\")` → `\"Bonjour Mga\"`","tests":[[["Mga"],"Bonjour Mga"],[["Lucas"],"Bonjour Lucas"],[[""],"Bonjour "]],"indice":"Colle deux textes avec `+` : `\"Bonjour \" + prenom`.","solution":"def dire_bonjour(prenom):\n    return \"Bonjour \" + prenom"},{"id":"pair","niveau":1,"points":5,"fonction":"est_pair","parametres":"n","enonce":"Écris une fonction `est_pair(n)` qui renvoie `True` si `n` est pair, sinon `False`.","tests":[[[4],true],[[7],false],[[0],true],[[-3],false]],"indice":"Un nombre est pair si le reste de sa division par 2 est 0 : `n % 2 == 0`.","solution":"def est_pair(n):\n    return n % 2 == 0"},{"id":"maximum","niveau":1,"points":5,"fonction":"plus_grand","parametres":"a, b","enonce":"Écris une fonction `plus_grand(a, b)` qui renvoie le **plus grand** des deux nombres, **sans utiliser `max()`**.","tests":[[[3,8],8],[[10,2],10],[[-1,-5],-1],[[4,4],4]],"indice":"Utilise un `if a > b:` … `else:`.","solution":"def plus_grand(a, b):\n    if a > b:\n        return a\n    return b","interdit":"max("},{"id":"fahrenheit","niveau":1,"points":5,"fonction":"en_fahrenheit","parametres":"celsius","enonce":"Écris `en_fahrenheit(celsius)` qui convertit des degrés Celsius en Fahrenheit.\nFormule : `F = C × 9 / 5 + 32`","tests":[[[0],32.0],[[100],212.0],[[-40],-40.0],[[37],98.6]],"indice":"`return celsius * 9 / 5 + 32`","solution":"def en_fahrenheit(celsius):\n    return celsius * 9 / 5 + 32"},{"id":"inverser","niveau":2,"points":10,"fonction":"inverser","parametres":"mot","enonce":"Écris `inverser(mot)` qui renvoie le mot **à l'envers**.\nExemple : `inverser(\"python\")` → `\"nohtyp\"`","tests":[[["python"],"nohtyp"],[["abc"],"cba"],[["a"],"a"],[[""],""]],"indice":"Une tranche avec un pas de -1 inverse un texte : `mot[::-1]`. Ou construis le résultat avec une boucle.","solution":"def inverser(mot):\n    return mot[::-1]"},{"id":"voyelles","niveau":2,"points":10,"fonction":"compter_voyelles","parametres":"mot","enonce":"Écris `compter_voyelles(mot)` qui renvoie le **nombre de voyelles** (a, e, i, o, u, y) dans un mot en minuscules.","tests":[[["python"],2],[["banane"],3],[["rythme"],2],[["xyz"],1],[[""],0]],"indice":"Fais une boucle `for lettre in mot:` et un compteur, avec `if lettre in \"aeiouy\":`.","solution":"def compter_voyelles(mot):\n    total = 0\n    for lettre in mot:\n        if lettre in \"aeiouy\":\n            total += 1\n    return total"},{"id":"somme","niveau":2,"points":10,"fonction":"somme","parametres":"nombres","enonce":"Écris `somme(nombres)` qui renvoie la **somme** d'une liste de nombres, **sans utiliser `sum()`**.","tests":[[[[1,2,3]],6],[[[10,-5]],5],[[[]],0],[[[7]],7]],"indice":"Commence avec `total = 0`, puis ajoute chaque nombre dans une boucle `for`.","solution":"def somme(nombres):\n    total = 0\n    for n in nombres:\n        total += n\n    return total","interdit":"sum("},{"id":"pairs","niveau":2,"points":10,"fonction":"garder_pairs","parametres":"nombres","enonce":"Écris `garder_pairs(nombres)` qui renvoie une **nouvelle liste** avec seulement les nombres pairs.\nExemple : `[1, 2, 3, 4]` → `[2, 4]`","tests":[[[[1,2,3,4]],[2,4]],[[[5,7]],[]],[[[0,10,11]],[0,10]],[[[]],[]]],"indice":"Crée une liste vide `resultat = []` et utilise `.append()` quand `n % 2 == 0`.","solution":"def garder_pairs(nombres):\n    resultat = []\n    for n in nombres:\n        if n % 2 == 0:\n            resultat.append(n)\n    return resultat"},{"id":"moyenne","niveau":2,"points":10,"fonction":"moyenne","parametres":"notes","enonce":"Écris `moyenne(notes)` qui renvoie la **moyenne** d'une liste de notes. Si la liste est vide, renvoie `0`.","tests":[[[[4,5,6]],5.0],[[[6]],6.0],[[[]],0],[[[3.5,4.5]],4.0]],"indice":"Moyenne = somme / nombre d'éléments. Attention à la liste vide (division par zéro !).","solution":"def moyenne(notes):\n    if not notes:\n        return 0\n    return sum(notes) / len(notes)"},{"id":"mots","niveau":2,"points":10,"fonction":"compter_mots","parametres":"phrase","enonce":"Écris `compter_mots(phrase)` qui renvoie le **nombre de mots** d'une phrase.","tests":[[["Bonjour le monde"],3],[["Python"],1],[[""],0],[["  deux   mots "],2]],"indice":"`phrase.split()` découpe une phrase en liste de mots (et ignore les espaces en trop).","solution":"def compter_mots(phrase):\n    return len(phrase.split())"},{"id":"factorielle","niveau":3,"points":15,"fonction":"factorielle","parametres":"n","enonce":"Écris `factorielle(n)` qui renvoie `n!` = 1 × 2 × 3 × … × n. Par convention, `factorielle(0)` vaut `1`.","tests":[[[0],1],[[1],1],[[5],120],[[10],3628800]],"indice":"Commence avec `resultat = 1` et multiplie par chaque nombre de `range(1, n + 1)`.","solution":"def factorielle(n):\n    resultat = 1\n    for i in range(1, n + 1):\n        resultat *= i\n    return resultat"},{"id":"fizzbuzz","niveau":3,"points":15,"fonction":"fizzbuzz","parametres":"n","enonce":"Écris `fizzbuzz(n)` qui renvoie :\n- `\"FizzBuzz\"` si n est divisible par 3 **et** 5\n- `\"Fizz\"` si divisible par 3\n- `\"Buzz\"` si divisible par 5\n- sinon le nombre **en texte** (`\"7\"`)","tests":[[[3],"Fizz"],[[5],"Buzz"],[[15],"FizzBuzz"],[[7],"7"],[[30],"FizzBuzz"]],"indice":"Teste d'abord le cas 3 ET 5 (`n % 15 == 0`), sinon il ne sera jamais atteint !","solution":"def fizzbuzz(n):\n    if n % 15 == 0:\n        return \"FizzBuzz\"\n    if n % 3 == 0:\n        return \"Fizz\"\n    if n % 5 == 0:\n        return \"Buzz\"\n    return str(n)"},{"id":"palindrome","niveau":3,"points":15,"fonction":"est_palindrome","parametres":"mot","enonce":"Écris `est_palindrome(mot)` qui renvoie `True` si le mot se lit pareil dans les deux sens (en ignorant les majuscules).\nExemple : `\"Kayak\"` → `True`","tests":[[["kayak"],true],[["Kayak"],true],[["python"],false],[["a"],true],[["Radar"],true]],"indice":"Mets le mot en minuscules avec `.lower()`, puis compare-le à son inverse `[::-1]`.","solution":"def est_palindrome(mot):\n    mot = mot.lower()\n    return mot == mot[::-1]"},{"id":"premier","niveau":3,"points":15,"fonction":"est_premier","parametres":"n","enonce":"Écris `est_premier(n)` qui renvoie `True` si `n` est un **nombre premier** (divisible seulement par 1 et lui-même). 0 et 1 ne sont pas premiers.","tests":[[[2],true],[[7],true],[[1],false],[[9],false],[[97],true],[[0],false]],"indice":"Essaie de diviser `n` par tous les nombres de 2 à n-1 : si un seul divise (`n % d == 0`), il n'est pas premier.","solution":"def est_premier(n):\n    if n < 2:\n        return False\n    for d in range(2, n):\n        if n % d == 0:\n            return False\n    return True"},{"id":"occurrences","niveau":3,"points":15,"fonction":"compter_lettres","parametres":"mot","enonce":"Écris `compter_lettres(mot)` qui renvoie un **dictionnaire** avec le nombre de fois que chaque lettre apparaît.\nExemple : `\"papa\"` → `{\"p\": 2, \"a\": 2}`","tests":[[["papa"],{"p":2,"a":2}],[["abc"],{"a":1,"b":1,"c":1}],[[""],{}]],"indice":"Commence avec `compte = {}`, puis pour chaque lettre : `compte[lettre] = compte.get(lettre, 0) + 1`.","solution":"def compter_lettres(mot):\n    compte = {}\n    for lettre in mot:\n        compte[lettre] = compte.get(lettre, 0) + 1\n    return compte"}],"NIVEAUX":{"1":"🟢 Facile","2":"🟡 Moyen","3":"🔴 Difficile"},"H_CORPUS":{"aventure":["HEROS marchait dans la forêt quand une lumière étrange apparut entre les arbres.","Au sommet de la montagne, un vieux dragon gardait un coffre rempli d'or.","Soudain, la forêt devint silencieuse et un loup géant sortit de l'ombre.","HEROS trouva une carte ancienne qui menait au sommet de la montagne.","Le vieux sage expliqua que la lumière étrange venait d'un cristal magique.","Dans la grotte, un dragon dormait sur un tas de pièces d'or.","HEROS décida de traverser la rivière pour rejoindre le village perdu.","Le loup géant regarda HEROS avec des yeux brillants comme des étoiles.","Au loin, le village perdu brillait sous la lumière de la lune.","Le cristal magique se mit à briller quand HEROS le toucha.","Un vieux sage vivait au bord de la rivière depuis des siècles.","La carte ancienne montrait un passage secret derrière la cascade.","HEROS courut vers la grotte pendant que l'orage grondait au loin.","Le dragon ouvrit un œil et sourit, car il attendait HEROS depuis longtemps."],"espace":["HEROS pilotait un petit vaisseau à travers une pluie d'étoiles filantes.","Sur une planète inconnue, un robot rouillé attendait depuis mille ans.","Soudain, l'alarme du vaisseau se mit à sonner dans tout le cockpit.","Le robot rouillé expliqua que la planète inconnue cachait un trésor.","HEROS posa le vaisseau près d'un cratère rempli de cristaux bleus.","Au loin, une station spatiale clignotait comme un phare dans la nuit.","Un extraterrestre gentil offrit à HEROS une carte des étoiles.","Les cristaux bleus brillaient chaque fois que le robot parlait.","HEROS découvrit que la station spatiale était abandonnée depuis longtemps.","La carte des étoiles menait vers une planète faite de glace.","Le vaisseau traversa un nuage violet qui sentait le chocolat.","Dans le cockpit, le robot rouillé apprit à HEROS à piloter."],"pirate":["HEROS était le plus jeune pirate du bateau, mais aussi le plus mali function blocsCommuns(a, b) {

  let total = 0;

      for (let j = b1; j < b2; j++) {

/* ---------------------------------------------------------------- le réseau de neurones (fait main, comme sur PC)
   phrase -> [entrées : mots et morceaux de mots] -> [16 neurones cachés] -> [une sortie par intention] */
function aleatoireGraine(graine) {   // petit générateur pseudo-aléatoire reproductible
  let x = graine >>> 0 || 7;
  return () => { x ^= x << 13; x >>>= 0; x ^= x >> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
}
function empreinte(objet) {   // empreinte simple (FNV-1a) pour savoir si les exemples ont changé
  const s = JSON.stringify(objet);
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16) + ":" + s.length;
}
class ReseauNeurones {
  constructor(cachees = 16) { this.cachees = cachees; this.vocabulaire = {}; this.etiquettes = []; this.precision = 0; this.nbExemples = 0; }
  entrees(texte, apprendre = false) {
    const e = [];
    for (const [cle, v] of caracteristiques(texte)) {
      if (!(cle in this.vocabulaire)) { if (!apprendre) continue; this.vocabulaire[cle] = Object.keys(this.vocabulaire).length; }
      e.push([this.vocabulaire[cle], v]);
    }
    const n = Math.sqrt(e.reduce((s, [, v]) => s + v * v, 0)) || 1;
    return e.map(([i, v]) => [i, v / n]);
  }
  propager(entrees) {
    const h = this.cachees, cache = this.b1.slice();
    for (const [i, v] of entrees) { const o = i * h; for (let j = 0; j < h; j++) cache[j] += v * this.W1[o + j]; }
    for (let j = 0; j < h; j++) cache[j] = Math.tanh(cache[j]);
    const nOut = this.etiquettes.length, sorties = this.b2.slice();
    for (let j = 0; j < h; j++) { const o = j * nOut, hj = cache[j]; for (let k = 0; k < nOut; k++) sorties[k] += hj * this.W2[o + k]; }
    const maxi = Math.max(...sorties);
    let total = 0;
    for (let k = 0; k < nOut; k++) { sorties[k] = Math.exp(sorties[k] - maxi); total += sorties[k]; }
    for (let k = 0; k < nOut; k++) sorties[k] /= total;
    return [cache, sorties];
  }
  /** Apprentissage par petits morceaux (pour ne jamais bloquer l'écran). */
  async entrainer(exemples, epoques = 60, taux = 0.25) {
    const alea = aleatoireGraine(7);
    this.etiquettes = Object.keys(exemples).sort();
    this.vocabulaire = {};
    const donnees = [];
    this.etiquettes.forEach((nom, k) => { for (const p of exemples[nom]) donnees.push([this.entrees(p, true), k]); });
    const nIn = Object.keys(this.vocabulaire).length, nOut = this.etiquettes.length, h = this.cachees;
    this.W1 = new Float32Array(nIn * h).map(() => alea() - 0.5);
    this.b1 = new Array(h).fill(0);
    this.W2 = new Float32Array(h * nOut).map(() => alea() - 0.5);
    this.b2 = new Array(nOut).fill(0);
    for (let ep = 0; ep < epoques; ep++) {
      for (let i = donnees.length - 1; i > 0; i--) { const j = Math.floor(alea() * (i + 1)); [donnees[i], donnees[j]] = [donnees[j], donnees[i]]; }
      const pas = taux * (1 - ep / (epoques * 1.3));
      for (const [entrees, bonne] of donnees) {
        const [cache, probas] = this.propager(entrees);
        probas[bonne] -= 1;
        const dCache = new Array(h);
        for (let j = 0; j < h; j++) {
          let s = 0; const o = j * nOut;
          for (let k = 0; k < nOut; k++) s += this.W2[o + k] * probas[k];
          dCache[j] = s * (1 - cache[j] * cache[j]);
        }
        for (let j = 0; j < h; j++) { const o = j * nOut, hj = cache[j]; for (let k = 0; k < nOut; k++) this.W2[o + k] -= pas * hj * probas[k]; }
        for (let k = 0; k < nOut; k++) this.b2[k] -= pas * probas[k];
        for (const [i, v] of entrees) { const o = i * h; for (let j = 0; j < h; j++) this.W1[o + j] -= pas * v * dCache[j]; }
        for (let j = 0; j < h; j++) this.b1[j] -= pas * dCache[j];
      }
      if (ep % 4 === 3) await new Promise((r) => setTimeout(r, 0));   // on laisse respirer l'écran
    }
    let justes = 0;
    for (const [e, bonne] of donnees) { const p = this.propager(e)[1]; if (p.indexOf(Math.max(...p)) === bonne) justes++; }
    this.precision = justes / Math.max(1, donnees.length);
    this.nbExemples = donnees.length;
    return this.precision;
  }
  predire(texte, n = 3) {
    if (!this.etiquettes.length) return [[], 0];
    const e = this.entrees(texte);
    let connus = 0;
    for (const cle of caracteristiques(texte).keys()) if (cle.startsWith("m:") && cle in this.vocabulaire) connus++;
    if (!e.length) return [[], 0];
    const p = this.propager(e)[1];
    return [this.etiquettes.map((nom, k) => [nom, p[k]]).sort((a, b) => b[1] - a[1]).slice(0, n), connus];
  }
  get nbPoids() { return this.W1.length + this.cachees + this.W2.length + this.etiquettes.length; }
  versObjet() {
    const arrondi = (t) => Array.from(t, (x) => Math.round(x * 1e4) / 1e4);
    return { cachees: this.cachees, vocabulaire: this.vocabulaire, etiquettes: this.etiquettes, W1: arrondi(this.W1), b1: this.b1,
             W2: arrondi(this.W2), b2: this.b2, precision: this.precision, nbExemples: this.nbExemples };
  }
  static depuisObjet(o) {
    const r = new ReseauNeurones(o.cachees);
    Object.assign(r, { vocabulaire: o.vocabulaire, etiquettes: o.etiquettes, b1: o.b1, b2: o.b2, precision: o.precision, nbExemples: o.nbExemples });
    r.W1 = Float32Array.from(o.W1); r.W2 = Float32Array.from(o.W2);
    return r;
  }
}

class ErreurPy extends Error {

/* -------------------------------------------------------------------------------- 1) découpage en jetons */
function decouper(source) {
